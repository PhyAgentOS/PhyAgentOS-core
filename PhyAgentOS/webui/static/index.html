<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>PhyAgentOS 设置</title>
<style>
  :root{
    --bg: #f4f6f9;
    --surface: #ffffff;
    --surface-2: #f8fafc;
    --line: #dce3ec;
    --line-strong: #c3cdda;
    --text: #172133;
    --muted: #5c6a7d;
    --faint: #7d8998;
    --blue: #1d4ed8;
    --blue-soft: #eff6ff;
    --orange-soft: #fff7ed;
    --orange-line: #fdba74;
    --red: #b91c1c;
    --red-soft: #fef2f2;
    --red-line: #fca5a5;
    --green-soft: #f0fdf4;
    --green-line: #86efac;
    --gray-soft: #f1f5f9;
    --radius: 10px;
    --shadow: 0 1px 2px rgba(16,24,40,.04);
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", "Noto Sans SC", "WenQuanYi Micro Hei", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Noto Sans Mono CJK SC", "WenQuanYi Hei Mono", monospace;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:auto;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:var(--font);
    font-size:14px;
    line-height:1.55;
    overflow-x:hidden;
  }
  body.has-savebar{padding-bottom:88px;}
  [hidden]{display:none !important;}
  a{color:var(--blue);}
  :focus-visible{outline:3px solid #2563eb;outline-offset:2px;}
  h1,h2,h3,p{margin-top:0;}
  h1{font-size:22px;line-height:1.3;margin:0 0 4px;font-weight:750;letter-spacing:-.01em;}
  h2{font-size:17px;line-height:1.35;margin:0 0 8px;}
  h3{font-size:14px;line-height:1.35;margin:0 0 6px;}
  code,.mono{font-family:var(--mono);font-size:12px;background:#eef2f7;color:#1e293b;padding:1px 5px;border-radius:4px;overflow-wrap:anywhere;}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
  .skip-link{
    position:fixed;left:12px;top:12px;z-index:400;background:#ffffff;color:#152033;
    border:2px solid #2563eb;border-radius:8px;padding:8px 12px;text-decoration:none;
    transform:translateY(-180%);transition:transform .15s ease;
  }
  .skip-link:focus{transform:translateY(0);}

  /* 顶栏 */
  .topbar{
    position:sticky;top:0;z-index:60;
    display:flex;align-items:center;justify-content:space-between;gap:10px 18px;
    min-height:54px;padding:8px 24px;
    background:rgba(255,255,255,.97);border-bottom:1px solid var(--line);
    backdrop-filter:blur(8px);
  }
  .brand{display:flex;align-items:center;gap:9px;min-width:0;}
  .brand-mark{
    display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;
    width:32px;height:32px;border-radius:8px;background:#1d4ed8;color:#ffffff;
    font-size:11px;font-weight:800;letter-spacing:.04em;
  }
  .brand-name{font-size:14px;font-weight:750;line-height:1.2;}
  .brand-sub{font-size:12.5px;color:var(--muted);}
  .restart-hint{margin:0;font-size:12px;color:var(--muted);line-height:1.4;text-align:right;}

  /* 布局 */
  .layout{
    display:grid;grid-template-columns:220px minmax(0,1fr);gap:24px;align-items:start;
    width:100%;max-width:1240px;margin:0 auto;padding:22px 24px 40px;min-width:0;
  }
  .content{min-width:0;max-width:960px;}

  /* 分组导航 */
  .sidebar{
    position:sticky;top:76px;align-self:start;min-width:0;
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:10px;
  }
  .nav-head{font-size:11px;font-weight:800;color:var(--faint);letter-spacing:.08em;margin:2px 8px 8px;}
  .group-select-label{display:none;}
  .group-select{display:none;}
  #config-nav-list{list-style:none;margin:0;padding:0;display:grid;gap:2px;min-width:0;}
  .nav-btn{
    width:100%;display:flex;align-items:center;gap:8px;
    border:0;background:none;border-radius:7px;padding:9px 10px;
    font:inherit;font-size:13.5px;font-weight:600;color:var(--text);text-align:left;cursor:pointer;
  }
  .nav-btn:hover{background:var(--surface-2);}
  .nav-btn[aria-current="true"]{background:var(--blue-soft);color:#1e3a8a;font-weight:750;}
  .nav-text{min-width:0;overflow-wrap:anywhere;}
  .nav-count{
    margin-left:auto;flex:0 0 auto;font-size:11px;font-weight:750;color:#9a3412;
    background:var(--orange-soft);border:1px solid var(--orange-line);
    border-radius:999px;padding:0 6px;line-height:1.6;
  }

  /* 组标题 */
  .page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px 16px;margin-bottom:14px;}
  .page-head-main{min-width:0;}
  .page-desc{margin:0;font-size:13px;color:var(--muted);line-height:1.5;}

  /* 表单容器 */
  .config-group{min-width:0;}
  .group-body{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:18px 20px 20px;min-width:0;
  }
  .group-body > .field{margin-bottom:16px;}
  .group-body > .field:last-child{margin-bottom:0;}

  /* 代理模型与 Provider 列表 */
  .agent-card,.provider-section{margin-bottom:18px;}
  .section-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;margin-bottom:10px;}
  .section-title{font-size:16px;line-height:1.35;margin:0;font-weight:750;}
  .agent-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:14px;margin-bottom:14px;min-width:0;}
  .agent-grid .field{margin:0;}
  .agent-follow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 12px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;min-width:0;}
  .agent-follow-title{font-size:13px;font-weight:700;color:#334155;}
  .agent-follow-note{font-size:12.5px;color:var(--muted);}

  .provider-list{border:1px solid var(--line);border-radius:8px;background:#ffffff;overflow:hidden;min-width:0;}
  .provider-item{border-top:1px solid var(--line);min-width:0;}
  .provider-item:first-child{border-top:0;}
  .provider-summary{display:flex;flex-wrap:wrap;align-items:center;gap:6px 9px;padding:10px 12px;cursor:pointer;list-style:none;min-width:0;}
  .provider-summary::-webkit-details-marker{display:none;}
  .provider-summary:hover{background:var(--surface-2);}
  .provider-name{font-family:var(--mono);font-size:13px;font-weight:700;overflow-wrap:anywhere;min-width:0;flex:1 1 auto;}
  .provider-meta{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin-left:auto;}
  .provider-body{padding:12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:14px;min-width:0;}
  .provider-body > .field{margin:0;}
  .provider-empty{padding:14px;margin:0;font-size:12.5px;color:var(--faint);}
  .forge-row{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;font-size:12.5px;line-height:1.55;min-width:0;}
  .forge-row-label{color:var(--faint);flex:0 0 auto;}
  .forge-row-value{min-width:0;max-width:100%;overflow-wrap:anywhere;word-break:break-word;}
  .forge-node-item{display:inline-flex;align-items:center;gap:6px;margin-right:10px;overflow-wrap:anywhere;}
  .forge-invalid{margin:8px 0 0;font-size:12px;line-height:1.5;color:#991b1b;overflow-wrap:anywhere;}
  .forge-runtime > .btn{margin-top:10px;}
  .forge-registry-search{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px;min-width:0;}
  .forge-registry-search input{flex:1 1 220px;max-width:420px;}
  .forge-registry-row{display:flex;flex-wrap:wrap;align-items:center;gap:5px 10px;padding:9px 12px;border-top:1px solid var(--line);min-width:0;}
  .forge-registry-row:first-child{border-top:0;}
  .forge-registry-name{font-family:var(--mono);font-size:13px;font-weight:700;overflow-wrap:anywhere;min-width:0;}
  .forge-registry-desc{font-size:12.5px;color:var(--muted);line-height:1.45;overflow-wrap:anywhere;flex:1 1 100%;margin:0;}
  .forge-registry-note{font-size:12px;color:var(--muted);overflow-wrap:anywhere;}
  .forge-registry-source{font-size:12px;color:var(--faint);margin:0 0 8px;overflow-wrap:anywhere;}
  .forge-remove{align-self:flex-start;}

  .agent-panel{margin-bottom:18px;min-width:0;}
  .agent-panel:last-child{margin-bottom:0;}
  .group-body > .agent-advanced{margin-bottom:18px;}
  .group-body > .agent-advanced:last-child{margin-bottom:0;}
  .agent-panel-title{font-size:15px;line-height:1.35;margin:0 0 10px;font-weight:750;}
  .agent-grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;min-width:0;}
  .agent-grid-2 .field{margin:0;}
  .agent-run-advanced{margin-top:14px;}

  .agent-feature{border:1px solid var(--line);border-radius:8px;background:#ffffff;overflow:hidden;margin-bottom:10px;min-width:0;}
  .agent-feature:last-child{margin-bottom:0;}
  .agent-feature > summary{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 9px;padding:10px 12px;cursor:pointer;list-style:none;}
  .agent-feature > summary::-webkit-details-marker{display:none;}
  .agent-feature > summary:hover{background:var(--surface-2);}
  .agent-feature[open] > summary{border-bottom:1px solid var(--line);}
  .agent-feature-title{font-size:13.5px;font-weight:750;color:#334155;}
  .agent-feature-desc{font-size:12px;color:var(--muted);line-height:1.45;min-width:0;overflow-wrap:anywhere;}
  .agent-feature-body{padding:12px;display:flex;flex-direction:column;gap:14px;min-width:0;}
  .agent-feature-body .field{margin:0;}

  .provider-advanced,.agent-advanced{border:1px solid var(--line);border-radius:8px;background:var(--surface-2);overflow:hidden;min-width:0;}
  .provider-advanced > summary,.agent-advanced > summary{display:flex;align-items:center;gap:8px;padding:9px 11px;font-size:12.5px;font-weight:650;color:#475569;cursor:pointer;list-style:none;}
  .provider-advanced > summary::-webkit-details-marker,.agent-advanced > summary::-webkit-details-marker{display:none;}
  .provider-advanced[open] > summary,.agent-advanced[open] > summary{border-bottom:1px solid var(--line);background:#ffffff;}
  .advanced-body{padding:12px;display:flex;flex-direction:column;gap:14px;min-width:0;}
  .advanced-body > .field{margin:0;}

  .add-provider{border:1px solid var(--line);border-radius:8px;background:var(--surface-2);padding:12px;margin-top:14px;min-width:0;}
  .add-provider-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;margin-bottom:10px;}
  .add-provider-title{font-size:13.5px;font-weight:750;color:#334155;}
  .add-provider-head .field-note{margin:0;}
  .add-provider-choose{display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-width:0;}
  .add-provider-choose .provider-label{font-size:13px;font-weight:700;color:#334155;}
  .add-provider-choose select{flex:1 1 200px;max-width:320px;}
  .add-provider-editor{display:flex;flex-direction:column;gap:14px;min-width:0;}
  .add-provider-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;}

  /* 字段 */
  .field{min-width:0;max-width:100%;}
  .field-wide{grid-column:1 / -1;}
  .field-head{display:flex;flex-wrap:wrap;align-items:center;gap:5px 8px;margin-bottom:5px;min-width:0;}
  .field-label{font-size:13px;font-weight:700;color:#344256;overflow-wrap:anywhere;line-height:1.4;}
  .req{color:#b91c1c;margin-left:2px;font-weight:800;}
  .field-state{
    font-size:11px;font-weight:700;color:#9a3412;background:var(--orange-soft);
    border:1px solid var(--orange-line);border-radius:999px;padding:1px 7px;
    overflow-wrap:anywhere;max-width:100%;
  }
  .field-desc{font-size:12.5px;color:var(--muted);line-height:1.5;margin:0 0 6px;overflow-wrap:anywhere;}
  .field-note{font-size:11.5px;color:var(--faint);line-height:1.45;margin:5px 0 0;overflow-wrap:anywhere;}
  .field-error{font-size:12px;color:#991b1b;line-height:1.45;margin:5px 0 0;overflow-wrap:anywhere;}
  .field-error[role="alert"]{font-weight:650;}

  input[type="text"],input[type="url"],input[type="password"],input[type="number"],select,textarea{
    width:100%;min-width:0;max-width:100%;min-height:36px;
    border:1px solid var(--line-strong);border-radius:7px;
    background:#ffffff;color:var(--text);font:inherit;font-size:13.5px;padding:6px 9px;
  }
  input[type="text"]:focus,input[type="url"]:focus,input[type="password"]:focus,input[type="number"]:focus,select:focus,textarea:focus{
    border-color:#60a5fa;outline:3px solid #dbeafe;outline-offset:0;
  }
  input[aria-invalid="true"],select[aria-invalid="true"],textarea[aria-invalid="true"]{
    border-color:#dc2626;background:#fffafa;
  }
  input:disabled,select:disabled,textarea:disabled{background:var(--surface-2);color:#64748b;cursor:not-allowed;}
  input[type="checkbox"]{width:16px;height:16px;accent-color:#1d4ed8;flex:0 0 auto;}
  .check-row{display:flex;align-items:center;gap:8px;font-size:13.5px;min-height:36px;flex-wrap:wrap;color:var(--text);}
  .check-row .check-text{font-size:13.5px;color:var(--text);font-weight:500;overflow-wrap:anywhere;}

  /* 密钥 */
  .secret-box{display:flex;flex-direction:column;gap:6px;min-width:0;}
  .secret-clear{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:2px;font-size:12px;color:#475569;}
  .secret-clear label{font-size:12px;color:#475569;font-weight:500;}

  /* 嵌套对象 */
  .object-block{
    border:1px solid var(--line);border-radius:8px;background:#fbfcfe;
    margin:10px 0 0;min-width:0;overflow:hidden;
  }
  .object-block > summary{display:flex;align-items:flex-start;gap:9px;padding:10px 12px;min-width:0;cursor:pointer;list-style:none;}
  .object-block > summary::-webkit-details-marker{display:none;}
  .object-block > summary:hover{background:#f4f7fb;}
  .object-block[open] > summary{border-bottom:1px solid var(--line);background:#ffffff;}
  .chevron{
    width:0;height:0;flex:0 0 auto;margin-top:6px;
    border-left:5px solid #7c8898;border-top:4px solid transparent;border-bottom:4px solid transparent;
    transition:transform .15s ease;
  }
  details[open] > summary .chevron{transform:rotate(90deg);}
  .obj-main{min-width:0;flex:1 1 auto;display:flex;flex-direction:column;gap:1px;}
  .obj-label{font-size:13px;font-weight:700;line-height:1.4;overflow-wrap:anywhere;}
  .obj-desc{font-size:12px;color:var(--muted);line-height:1.45;overflow-wrap:anywhere;}
  .obj-meta{display:flex;flex-wrap:wrap;align-items:flex-start;gap:5px;flex:0 0 auto;margin-left:auto;}
  .object-body{
    padding:12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
    gap:14px;align-items:start;min-width:0;
  }

  /* 数组与键值编辑 */
  .collection{border:1px solid var(--line);border-radius:8px;background:#ffffff;min-width:0;overflow:hidden;}
  .collection-list{max-height:380px;overflow-y:auto;overflow-x:hidden;min-width:0;}
  .collection-empty{padding:10px 12px;font-size:12px;color:var(--faint);margin:0;}
  .collection-add{display:flex;flex-wrap:wrap;gap:7px;align-items:center;padding:9px 10px;border-top:1px solid #edf1f6;background:var(--surface-2);}
  .array-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px;align-items:center;padding:8px 10px;border-top:1px solid #edf1f6;min-width:0;}
  .array-row:first-child{border-top:0;}
  .array-card{border-top:1px solid #edf1f6;padding:9px 10px 11px;min-width:0;}
  .array-card:first-child{border-top:0;}
  .array-card-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px;margin-bottom:7px;min-width:0;}
  .array-card-title{font-size:12px;font-weight:700;color:#334155;}
  .array-card-body{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;min-width:0;}

  .map-editor{border:1px solid var(--line);border-radius:8px;background:#ffffff;min-width:0;overflow:hidden;}
  .mcp-remove{align-self:flex-start;}
  .map-list{max-height:380px;overflow-y:auto;overflow-x:hidden;min-width:0;}
  .map-row{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr) auto;gap:8px;align-items:start;padding:9px 10px;border-top:1px solid #edf1f6;min-width:0;}
  .map-row:first-child{border-top:0;}
  .map-key{min-width:0;}
  .map-key input{font-family:var(--mono);font-size:12px;}
  .map-value{min-width:0;}
  .map-add{display:flex;flex-wrap:wrap;gap:7px;align-items:center;padding:9px 10px;border-top:1px solid #edf1f6;background:var(--surface-2);min-width:0;}
  .map-add input{flex:1 1 160px;min-width:0;}
  .map-error{font-size:12px;color:#991b1b;margin:0;padding:7px 10px;border-top:1px solid #fecaca;background:var(--red-soft);}

  .json-field textarea{
    min-height:150px;max-height:360px;resize:vertical;
    font-family:var(--mono);font-size:12px;line-height:1.55;
    white-space:pre;overflow:auto;
  }
  .json-actions{display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin-top:6px;}

  /* 按钮与徽标 */
  .btn{
    appearance:none;border:1px solid var(--line-strong);background:#ffffff;color:var(--text);
    border-radius:8px;padding:7px 12px;font:inherit;font-size:13px;font-weight:650;
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    min-height:36px;cursor:pointer;text-decoration:none;line-height:1.25;
  }
  .btn:hover:not(:disabled){background:var(--surface-2);border-color:#94a3b8;}
  .btn-primary{background:var(--blue);border-color:var(--blue);color:#ffffff;}
  .btn-primary:hover:not(:disabled){background:#1e40af;border-color:#1e40af;color:#ffffff;}
  .btn-danger{border-color:var(--red-line);color:#991b1b;background:#ffffff;}
  .btn-danger:hover:not(:disabled){background:var(--red-soft);border-color:#f87171;}
  .btn-small{padding:4px 9px;min-height:30px;font-size:12px;}
  .btn-quiet{border-color:transparent;color:var(--muted);background:transparent;}
  .btn-quiet:hover:not(:disabled){background:var(--surface-2);border-color:var(--line);}
  .btn[disabled],.btn:disabled{opacity:.56;cursor:not-allowed;background:var(--surface-2);color:#64748b;border-color:#cbd5e1;}

  .badge{
    display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;
    border:1px solid transparent;font-size:11px;font-weight:700;line-height:1.55;white-space:nowrap;
  }
  .badge-blue{background:var(--blue-soft);color:#1e40af;border-color:#bfdbfe;}
  .badge-orange{background:var(--orange-soft);color:#9a3412;border-color:var(--orange-line);}
  .badge-red{background:var(--red-soft);color:#991b1b;border-color:var(--red-line);}
  .badge-green{background:var(--green-soft);color:#166534;border-color:var(--green-line);}
  .badge-gray{background:var(--gray-soft);color:#475569;border-color:#cbd5e1;}

  /* 加载与提示 */
  .state-card{
    display:flex;align-items:flex-start;gap:12px;background:#ffffff;
    border:1px solid var(--line);border-radius:var(--radius);padding:18px;
    box-shadow:var(--shadow);
  }
  .state-card strong{display:block;margin-bottom:2px;}
  .state-card p{margin:0;}
  .spinner{
    width:18px;height:18px;flex:0 0 auto;margin-top:2px;border-radius:50%;
    border:2px solid #bfdbfe;border-top-color:#1d4ed8;animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .state-card .btn{margin-top:10px;}
  .hint{font-size:12px;color:var(--muted);line-height:1.5;margin:4px 0 0;}
  .notice{
    display:flex;align-items:flex-start;justify-content:space-between;gap:10px 14px;flex-wrap:wrap;
    border:1px solid var(--line);border-radius:9px;background:#ffffff;
    padding:12px 14px;margin:0 0 16px;min-width:0;
  }
  .notice-main{min-width:0;flex:1 1 260px;}
  .notice strong{display:block;font-size:13px;line-height:1.4;}
  .notice p{margin:4px 0 0;font-size:13px;line-height:1.5;overflow-wrap:anywhere;}
  .notice-error{background:var(--red-soft);border-color:var(--red-line);}
  .notice-error strong{color:#991b1b;}
  .notice-action{flex:0 0 auto;}

  /* 底部保存条 */
  .savebar{
    position:fixed;left:0;right:0;bottom:0;z-index:90;
    background:rgba(255,255,255,.98);border-top:1px solid var(--line);
    box-shadow:0 -6px 20px rgba(15,23,42,.08);
    padding:10px 24px calc(10px + env(safe-area-inset-bottom));
  }
  .savebar-inner{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    width:100%;max-width:1192px;margin:0 auto;min-width:0;
  }
  .savebar-status{font-size:13px;color:var(--muted);min-width:0;overflow-wrap:anywhere;}
  .savebar-status.is-dirty{color:#9a3412;font-weight:700;}
  .savebar-actions{display:flex;align-items:center;gap:8px;flex:0 0 auto;}

  /* 轻提示 */
  .toast{
    position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);
    z-index:120;max-width:calc(100vw - 32px);
    background:#14532d;color:#ffffff;border-radius:8px;padding:10px 16px;
    font-size:13px;line-height:1.45;box-shadow:0 10px 28px rgba(15,23,42,.22);
  }
  body.has-savebar .toast{bottom:calc(86px + env(safe-area-inset-bottom));}

  /* 对话框 */
  dialog{
    width:min(560px,calc(100vw - 28px));max-height:calc(100vh - 40px);overflow-y:auto;
    border:1px solid var(--line-strong);border-radius:12px;padding:0;
    background:#ffffff;color:var(--text);box-shadow:0 24px 60px rgba(15,23,42,.3);
  }
  dialog::backdrop{background:rgba(15,23,42,.48);}
  .dialog-body{padding:18px 20px 16px;}
  .dialog-body h2{margin:0 0 8px;}
  .dialog-body p{font-size:13px;color:#334155;margin-bottom:8px;}
  .dialog-extra{font-size:12px;color:var(--muted);line-height:1.5;overflow-wrap:anywhere;}
  .confirm-changes{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:5px;max-height:210px;overflow:auto;}
  .confirm-changes li{font-size:12px;line-height:1.45;overflow-wrap:anywhere;border-bottom:1px dashed #e2e8f0;padding-bottom:4px;}
  .confirm-changes li:last-child{border-bottom:0;}
  .confirm-changes .diff-path{display:block;font-family:var(--mono);font-size:11.5px;color:#334155;overflow-wrap:anywhere;}
  .dialog-actions{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;margin-top:14px;}

  noscript{display:block;background:var(--orange-soft);border:1px solid var(--orange-line);color:#7c2d12;padding:10px 12px;border-radius:8px;margin:12px 0;font-size:12px;}

  @media (max-width:900px){
    body.has-savebar{padding-bottom:104px;}
    .layout{display:block;padding:14px 14px 32px;}
    .sidebar{
      position:static;padding:10px 12px;margin-bottom:14px;
    }
    .nav-head{display:none;}
    #config-nav-list{display:none;}
    .group-select-label{display:block;font-size:12px;font-weight:700;color:#475569;margin:0 0 6px;}
    .group-select{display:block;width:100%;min-height:40px;font-size:14px;}
    .content{max-width:none;}
    .topbar{padding:8px 14px;}
    .restart-hint{font-size:11.5px;}
    .group-body{padding:14px 14px 16px;}
    .object-body,.array-card-body{grid-template-columns:repeat(auto-fit,minmax(210px,1fr));}
    .agent-grid,.agent-grid-2{grid-template-columns:minmax(0,1fr);}
    .map-row{grid-template-columns:minmax(0,1fr);gap:6px;}
    .map-row .btn{justify-self:start;}
  }
  @media (max-width:520px){
    body.has-savebar{padding-bottom:128px;}
    .topbar{flex-wrap:wrap;gap:2px 12px;}
    .restart-hint{width:100%;text-align:left;font-size:11.5px;}
    .savebar{padding:10px 12px calc(10px + env(safe-area-inset-bottom));}
    .savebar-inner{flex-direction:column;align-items:stretch;gap:8px;max-width:none;}
    .savebar-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
    .savebar-actions .btn{width:100%;}
    .object-body,.array-card-body{grid-template-columns:minmax(0,1fr);}
    .page-head{flex-wrap:wrap;}
    .field-state{max-width:100%;}
    .add-provider-choose select{max-width:none;}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none !important;animation:none !important;}
  }

<body>
<a class="skip-link" href="#main-content">跳到主要内容</a>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">PA</span>
    <span class="brand-name">PhyAgentOS</span>
    <span class="brand-sub">设置</span>
  </div>
  <p class="restart-hint">保存后需重启 Agent 才能生效</p>
</header>

<main id="main-content" aria-busy="true">
  <div class="layout">
    <nav class="sidebar" aria-label="设置分组">
      <div class="nav-head">设置分组</div>
      <label class="group-select-label" for="group-select">设置分组</label>
      <select class="group-select" id="group-select"></select>
      <ul id="config-nav-list"></ul>
    </nav>

    <div class="content">
      <div class="state-card" id="state-loading" aria-live="polite">
        <span class="spinner" aria-hidden="true"></span>
        <div>
          <strong>正在读取配置…</strong>
          <p class="hint">从本机设置服务加载当前配置。</p>
        </div>
      </div>

      <div class="notice notice-error" id="state-error" role="alert" hidden>
        <div class="notice-main">
          <strong>无法加载设置</strong>
          <p id="load-error-message"></p>
        </div>
        <span class="notice-action">
          <button type="button" class="btn btn-small" id="retry-btn">重新加载</button>
        </span>
      </div>

      <div id="settings-root" hidden>
        <div class="page-head">
          <div class="page-head-main">
            <h1 id="page-title">设置</h1>
            <p class="page-desc" id="page-desc"></p>
          </div>
          <button type="button" class="btn btn-small btn-quiet" id="reload-btn">重新加载</button>
        </div>

        <div class="notice notice-error" id="notice-error" role="alert" hidden>
          <div class="notice-main">
            <strong>操作未完成</strong>
            <p id="notice-error-text"></p>
          </div>
          <span class="notice-action" id="notice-error-action-wrap" hidden>
            <button type="button" class="btn btn-small" id="notice-error-action-btn">重新加载</button>
          </span>
        </div>

        <div id="config-sections"></div>
      </div>
    </div>
  </div>
</main>

<div class="savebar" id="actionbar" role="region" aria-label="未保存修改" hidden>
  <div class="savebar-inner">
    <span class="savebar-status" id="dirty-label" aria-live="polite">没有未保存修改</span>
    <div class="savebar-actions">
      <button type="button" class="btn" id="discard-btn">放弃修改</button>
      <button type="button" class="btn btn-primary" id="save-btn" disabled>保存更改</button>
    </div>
  </div>
</div>

<div class="toast" id="notice-success" role="status" hidden>
  <span id="notice-success-text"></span>
</div>

<dialog id="confirm-dialog" aria-labelledby="confirm-title">
  <div class="dialog-body">
    <h2 id="confirm-title">确认操作</h2>
    <p id="confirm-message"></p>
    <div class="dialog-extra" id="confirm-extra"></div>
    <div class="dialog-actions">
      <button type="button" class="btn" id="confirm-cancel">取消</button>
      <button type="button" class="btn btn-primary" id="confirm-ok">确认</button>
    </div>
  </div>
</dialog>

<noscript>
  <div class="notice notice-error">此页面需要 JavaScript 才能读取和保存配置；未启用 JavaScript 时不会显示或伪造任何配置。</div>
</noscript><script>
(function () {
  'use strict';

  var byId = function (id) { return document.getElementById(id); };

  var state = {
    ready: false,
    loading: false,
    saving: false,
    dirty: false,
    config: null,
    schema: null,
    defs: {},
    baseline: null,
    draft: null,
    revision: null,
    secretFields: {},
    clearSecrets: new Set(),
    jsonErrors: new Map(),
    diffEntries: [],
    restartRequired: false,
    groups: [],
    activeGroup: null,
    addProviderStage: 'idle',
    addProviderKey: null,
    renderOpenKeys: null,
    forgeRuntime: { status: 'idle', data: null, error: null },
    forgeRegistry: { status: 'idle', data: null, error: null, query: '' },
    forgeActionsEnabled: false,
    forgeJob: null,
    forgePollId: null,
    noticeAction: null,
    uid: 0
  };

  var toastTimer = null;

  var GROUP_LABELS = {
    providers: 'Model',
    agents: 'Agent',
    channels: '渠道',
    gateway: 'Gateway',
    tools: 'Tool',
    embodiments: 'Embodiment',
    forge: 'Forge',
    resource_registry: '资源仓库',
    resourceRegistry: '资源仓库'
  };

  // Schema 中存在但 model_dump(exclude=True) 不会出现在配置里的字段。
  // 保留在原始 config 中（若存在），但不渲染为可编辑字段。
  var HIDDEN_SCHEMA_PATHS = {
    'agents.defaults.memoryWindow': true
  };

  // 界面用更易读的单位显示，data-path 保存的仍是原始值（秒）。
  var UNIT_SCALE_PATHS = {
    'forge.unknownRecoveryTimeoutS': 60
  };

  function unitScaleFor(segs) {
    var scale = UNIT_SCALE_PATHS[pathKey(segs)];
    return typeof scale === 'number' && scale > 0 ? scale : 0;
  }

  var MCP_FIELD_LABELS = {
    type: '连接方式',
    command: '启动命令',
    args: '命令参数',
    env: '环境变量',
    url: '服务地址',
    headers: '请求头',
    toolTimeout: '工具超时（秒）'
  };

  var GROUP_DESCRIPTIONS = {
    providers: '配置主代理使用的模型，并管理已添加的 Provider。子代理跟随主代理。',
    agents: '设置主代理的工作目录、生成参数、运行限制和可选功能。',
    channels: '聊天渠道接入、访问控制与消息行为。',
    gateway: 'Gateway 监听地址和心跳间隔。',
    tools: 'Web 搜索、Shell 执行、工作区限制和 MCP Server。',
    embodiments: '单机或 fleet 模式的机器人知识配置。',
    forge: '查看已安装的 Forge Skill 与工具，并调整 unknown 恢复、取消确认和证据设置；Skill 与 Node 下载源也在这里。',
    resource_registry: 'Skill 与 Forge Runtime 使用的公共资源仓库地址。',
    resourceRegistry: 'Skill 与 Forge Runtime 使用的公共资源仓库地址。'
  };

  // ---------- 基础工具 ----------

  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (typeof text === 'string') node.textContent = text;
    return node;
  }

  function clearNode(node) {
    if (!node) return;
    while (node.firstChild) node.removeChild(node.firstChild);
  }

  function isPlainObject(value) {
    return Object.prototype.toString.call(value) === '[object Object]';
  }

  function hasOwn(obj, key) {
    return Object.prototype.hasOwnProperty.call(obj, key);
  }

  function clone(value) {
    if (value === undefined) return undefined;
    try {
      if (typeof structuredClone === 'function') return structuredClone(value);
    } catch (e) { /* fall through */ }
    try { return JSON.parse(JSON.stringify(value)); } catch (e) { return value; }
  }

  function nextId(prefix) {
    state.uid += 1;
    return prefix + '-' + state.uid;
  }

  function shortText(value, max) {
    var text = String(value);
    if (text.length <= max) return text;
    return text.slice(0, max - 1) + '…';
  }

  function formatValue(value, max) {
    var limit = max || 110;
    if (value === undefined) return '（未设置）';
    if (value === null) return 'null';
    if (typeof value === 'string') return shortText(JSON.stringify(value), limit);
    if (typeof value === 'number' || typeof value === 'boolean') return String(value);
    try {
      return shortText(JSON.stringify(value), limit);
    } catch (e) {
      return '（无法显示）';
    }
  }

  function pathKey(segs) {
    var out = '';
    for (var i = 0; i < segs.length; i += 1) {
      var seg = segs[i];
      if (typeof seg === 'number') {
        out += '[' + seg + ']';
      } else if (out === '') {
        out = String(seg);
      } else if (/^[A-Za-z_][A-Za-z0-9_]*$/.test(String(seg))) {
        out += '.' + seg;
      } else {
        out += '[' + JSON.stringify(String(seg)) + ']';
      }
    }
    return out;
  }

  function getAt(root, segs) {
    var cur = root;
    for (var i = 0; i < segs.length; i += 1) {
      if (cur === null || typeof cur !== 'object') return undefined;
      var seg = segs[i];
      if (!hasOwn(cur, seg)) return undefined;
      cur = cur[seg];
    }
    return cur;
  }

  function setAt(root, segs, value) {
    if (!segs.length) return;
    var cur = root;
    for (var i = 0; i < segs.length - 1; i += 1) {
      var seg = segs[i];
      var next = segs[i + 1];
      if (cur[seg] === null || typeof cur[seg] !== 'object') {
        cur[seg] = (typeof next === 'number') ? [] : {};
      }
      cur = cur[seg];
    }
    cur[segs[segs.length - 1]] = value;
  }

  function deleteAt(root, segs) {
    if (!segs.length) return;
    var parent = getAt(root, segs.slice(0, -1));
    if (parent === null || typeof parent !== 'object') return;
    var last = segs[segs.length - 1];
    if (Array.isArray(parent) && typeof last === 'number') {
      parent.splice(last, 1);
      return;
    }
    delete parent[last];
  }

  function withinPath(entryPath, prefix) {
    if (prefix === '') return true;
    return entryPath === prefix || entryPath.indexOf(prefix + '.') === 0 || entryPath.indexOf(prefix + '[') === 0;
  }

  // ---------- schema 解析 ----------

  function lookupRef(ref) {
    if (typeof ref !== 'string') return null;
    var marker = ref.indexOf('#/$defs/');
    var name = null;
    if (marker === 0) name = ref.slice('#/$defs/'.length);
    if (name === null && ref.indexOf('#/definitions/') === 0) name = ref.slice('#/definitions/'.length);
    if (name === null) return null;
    var defs = state.defs || {};
    return hasOwn(defs, name) ? defs[name] : null;
  }

  function isNullSchema(node) {
    if (!node || typeof node !== 'object') return false;
    if (node.type === 'null') return true;
    if (node.const === null) return true;
    if (Array.isArray(node.enum) && node.enum.length === 1 && node.enum[0] === null) return true;
    return false;
  }

  function resolveNode(rawSchema) {
    var node = (rawSchema && typeof rawSchema === 'object') ? rawSchema : {};
    var nullable = false;
    var guard = 0;

    while (node.$ref && guard < 20) {
      guard += 1;
      var target = lookupRef(node.$ref);
      if (!target || typeof target !== 'object') break;
      var mergedRef = {};
      Object.keys(target).forEach(function (key) { mergedRef[key] = target[key]; });
      Object.keys(node).forEach(function (key) {
        if (key !== '$ref') mergedRef[key] = node[key];
      });
      node = mergedRef;
    }

    if (Array.isArray(node.allOf)) {
      var mergedAll = {};
      node.allOf.forEach(function (part) {
        var resolvedPart = resolveNode(part).node || {};
        Object.keys(resolvedPart).forEach(function (key) {
          if (key === 'properties') {
            mergedAll.properties = Object.assign({}, mergedAll.properties || {}, resolvedPart.properties || {});
          } else if (key === 'required') {
            mergedAll.required = (mergedAll.required || []).concat(resolvedPart.required || []);
          } else if (!hasOwn(mergedAll, key)) {
            mergedAll[key] = resolvedPart[key];
          }
        });
      });
      Object.keys(node).forEach(function (key) {
        if (key === 'allOf') return;
        if (key === 'properties') {
          mergedAll.properties = Object.assign({}, mergedAll.properties || {}, node.properties || {});
        } else {
          mergedAll[key] = node[key];
        }
      });
      node = mergedAll;
    }

    var union = node.anyOf || node.oneOf;
    if (Array.isArray(union)) {
      var nonNull = [];
      var hasNull = node.type === 'null';
      union.forEach(function (branch) {
        if (isNullSchema(branch)) hasNull = true;
        else nonNull.push(branch);
      });
      if (nonNull.length === 1) {
        var resolvedBranch = resolveNode(nonNull[0]);
        var merged = {};
        Object.keys(resolvedBranch.node || {}).forEach(function (key) { merged[key] = resolvedBranch.node[key]; });
        Object.keys(node).forEach(function (key) {
          if (key !== 'anyOf' && key !== 'oneOf') merged[key] = node[key];
        });
        return {
          node: merged,
          nullable: nullable || hasNull || resolvedBranch.nullable,
          unionComplex: false
        };
      }
      return {
        node: node,
        nullable: hasNull,
        unionComplex: nonNull.length > 1 || (hasNull && nonNull.length === 0)
      };
    }

    if (Array.isArray(node.type)) {
      var types = node.type.filter(function (type) { return type !== 'null'; });
      var arrayNullable = node.type.indexOf('null') !== -1;
      if (types.length === 1) {
        var mergedType = {};
        Object.keys(node).forEach(function (key) { mergedType[key] = node[key]; });
        mergedType.type = types[0];
        return { node: mergedType, nullable: arrayNullable, unionComplex: false };
      }
      return { node: node, nullable: arrayNullable, unionComplex: types.length > 1 };
    }

    return { node: node, nullable: nullable || node.type === 'null', unionComplex: false };
  }

  function defaultForSchema(rawSchema, depth) {
    var level = depth || 0;
    if (level > 14) return null;
    var resolved = resolveNode(rawSchema);
    var node = resolved.node || {};
    if (hasOwn(node, 'default')) return clone(node.default);
    if (hasOwn(node, 'const')) return clone(node.const);
    if (Array.isArray(node.enum) && node.enum.length) return clone(node.enum[0]);
    if (resolved.unionComplex) return null;
    if (resolved.nullable) return null;

    if (node.type === 'object' || node.properties) {
      var obj = {};
      var props = node.properties || {};
      var required = node.required || [];
      Object.keys(props).forEach(function (key) {
        var child = resolveNode(props[key]).node || {};
        if (hasOwn(child, 'default')) {
          obj[key] = clone(child.default);
        } else if (required.indexOf(key) !== -1) {
          obj[key] = defaultForSchema(props[key], level + 1);
        }
      });
      return obj;
    }
    if (node.type === 'array') return [];
    if (node.type === 'boolean') return false;
    if (node.type === 'integer' || node.type === 'number') return 0;
    if (node.type === 'string') return '';
    return null;
  }

  function normalizeValue(value, rawSchema, depth) {
    var level = depth || 0;
    if (level > 14) return value;
    if (value === undefined) return undefined;
    var resolved = resolveNode(rawSchema);
    var node = resolved.node || {};
    if (value === null) return null;
    if (resolved.unionComplex) return value;

    if ((node.type === 'object' || node.properties) && isPlainObject(value)) {
      var out = {};
      Object.keys(value).forEach(function (key) { out[key] = value[key]; });
      var props = node.properties || {};
      Object.keys(props).forEach(function (key) {
        if (hasOwn(out, key)) out[key] = normalizeValue(out[key], props[key], level + 1);
      });
      if (node.additionalProperties && typeof node.additionalProperties === 'object') {
        Object.keys(out).forEach(function (key) {
          if (!hasOwn(props, key)) {
            out[key] = normalizeValue(out[key], node.additionalProperties, level + 1);
          }
        });
      }
      return out;
    }

    if (node.type === 'array' && Array.isArray(value) && node.items && typeof node.items === 'object') {
      return value.map(function (item) { return normalizeValue(item, node.items, level + 1); });
    }
    return value;
  }

  function isHiddenSchemaPath(segs) {
    return HIDDEN_SCHEMA_PATHS[segs.map(String).join('.')] === true;
  }

  function schemaAtPath(segs) {
    var node = state.schema;
    for (var i = 0; i < segs.length; i += 1) {
      var resolved = resolveNode(node);
      node = resolved.node;
      if (!node) return null;
      var seg = segs[i];
      if (typeof seg === 'number') {
        if (!node.items) return null;
        node = node.items;
      } else if (node.properties && hasOwn(node.properties, seg)) {
        node = node.properties[seg];
      } else if (node.additionalProperties && typeof node.additionalProperties === 'object') {
        node = node.additionalProperties;
      } else {
        return null;
      }
    }
    return node;
  }

  // ---------- 秘密字段 ----------

  function camelizeSnake(segment) {
    return String(segment).replace(/_([a-z0-9])/g, function (m, ch) { return ch.toUpperCase(); });
  }

  function canonicalSecretPath(segs) {
    return segs.map(function (seg) {
      return typeof seg === 'number' ? String(seg) : camelizeSnake(seg);
    }).join('.');
  }

  function secretInfo(segs) {
    for (var i = 0; i < segs.length; i += 1) {
      if (typeof segs[i] === 'number') return null;
    }
    var raw = segs.map(String).join('.');
    var camel = canonicalSecretPath(segs);
    if (hasOwn(state.secretFields, raw)) {
      return { key: raw, configured: !!state.secretFields[raw] };
    }
    if (hasOwn(state.secretFields, camel)) {
      return { key: camel, configured: !!state.secretFields[camel] };
    }
    return null;
  }

  // ---------- 标签与描述 ----------

  function humanize(key) {
    var text = String(key).replace(/_/g, ' ');
    text = text.replace(/([a-z0-9])([A-Z])/g, '$1 $2');
    text = text.replace(/([A-Z]+)([A-Z][a-z])/g, '$1 $2');
    var abbreviations = {
      api: 'API', url: 'URL', id: 'ID', ids: 'IDs', json: 'JSON', http: 'HTTP', https: 'HTTPS',
      mcp: 'MCP', tls: 'TLS', ssl: 'SSL', imap: 'IMAP', smtp: 'SMTP', e2ee: 'E2EE',
      ui: 'UI', cli: 'CLI', llm: 'LLM', aws: 'AWS', oauth: 'OAuth', qq: 'QQ', dm: 'DM',
      ms: 'ms', s: 's', sdk: 'SDK', tcp: 'TCP', ws: 'WS', sse: 'SSE'
    };
    return text.split(/\s+/).filter(Boolean).map(function (word) {
      if (word === word.toUpperCase() && word.length > 1) return word;
      var low = word.toLowerCase();
      if (hasOwn(abbreviations, low)) return abbreviations[low];
      return low.charAt(0).toUpperCase() + low.slice(1);
    }).join(' ');
  }

  function schemaDescription(rawSchema) {
    var resolved = resolveNode(rawSchema);
    var node = resolved.node || {};
    if (typeof node.description === 'string' && node.description.trim()) return node.description.trim();
    return '';
  }

  function groupLabel(key) {
    return hasOwn(GROUP_LABELS, key) ? GROUP_LABELS[key] : humanize(key);
  }

  function groupDescription(key) {
    if (hasOwn(GROUP_DESCRIPTIONS, key)) return GROUP_DESCRIPTIONS[key];
    return schemaDescription((state.schema.properties || {})[key]);
  }

  // ---------- 差异计算 ----------

  function valuesEqual(a, b) {
    if (a === b) return true;
    if (typeof a === 'number' && typeof b === 'number' && isNaN(a) && isNaN(b)) return true;
    return false;
  }

  function makeEntry(segs, oldValue, newValue, secretKind) {
    return {
      path: pathKey(segs),
      segs: segs.slice(),
      old: oldValue,
      new: newValue,
      secret: secretKind || null
    };
  }

  function computeDiff(oldValue, newValue, segs, out) {
    var secret = secretInfo(segs);
    if (secret) {
      var canonical = secret.key;
      if (state.clearSecrets.has(canonical) && secret.configured) {
        out.push(makeEntry(segs, secret.configured ? 'configured' : 'unconfigured', 'cleared', 'clear'));
        return;
      }
      if (typeof newValue === 'string' && newValue !== '') {
        out.push(makeEntry(segs, secret.configured ? 'configured' : 'unconfigured', 'replaced', 'replace'));
      }
      return;
    }

    if (oldValue === undefined && newValue === undefined) return;
    if (oldValue === undefined || newValue === undefined) {
      out.push(makeEntry(segs, oldValue, newValue));
      return;
    }

    if (isPlainObject(oldValue) && isPlainObject(newValue)) {
      var keys = {};
      Object.keys(oldValue).forEach(function (key) { keys[key] = true; });
      Object.keys(newValue).forEach(function (key) { keys[key] = true; });
      Object.keys(keys).forEach(function (key) {
        var hasOld = hasOwn(oldValue, key);
        var hasNew = hasOwn(newValue, key);
        if (!hasNew) {
          out.push(makeEntry(segs.concat(key), oldValue[key], undefined));
        } else if (!hasOld) {
          out.push(makeEntry(segs.concat(key), undefined, newValue[key]));
        } else {
          computeDiff(oldValue[key], newValue[key], segs.concat(key), out);
        }
      });
      return;
    }

    if (Array.isArray(oldValue) && Array.isArray(newValue)) {
      var common = Math.min(oldValue.length, newValue.length);
      for (var i = 0; i < common; i += 1) {
        computeDiff(oldValue[i], newValue[i], segs.concat(i), out);
      }
      for (var oldIndex = common; oldIndex < oldValue.length; oldIndex += 1) {
        out.push(makeEntry(segs.concat(oldIndex), oldValue[oldIndex], undefined));
      }
      for (var newIndex = common; newIndex < newValue.length; newIndex += 1) {
        out.push(makeEntry(segs.concat(newIndex), undefined, newValue[newIndex]));
      }
      return;
    }

    if (!valuesEqual(oldValue, newValue)) {
      out.push(makeEntry(segs, oldValue, newValue));
    }
  }

  // ---------- 渲染 ----------

  function resetUids() {
    state.uid = 0;
  }

  function buildGroups() {
    var props = (state.schema && state.schema.properties) || {};
    var desired = ['providers', 'agents', 'tools', 'embodiments', 'forge'];
    Object.keys(props).forEach(function (key) {
      if (key === 'gateway' || key === 'channels') return;
      if (key === 'resource_registry' || key === 'resourceRegistry') return;
      if (desired.indexOf(key) === -1) desired.push(key);
    });
    if (hasOwn(props, 'channels')) desired.push('channels');
    return desired.filter(function (key) { return hasOwn(props, key); }).map(function (key) {
      return { key: key, schema: props[key], label: groupLabel(key), description: groupDescription(key) };
    });
  }

  function hasDiff(path) {
    return state.diffEntries.some(function (entry) {
      return withinPath(entry.path, path);
    });
  }

  function groupByKey(key) {
    for (var i = 0; i < state.groups.length; i += 1) {
      if (state.groups[i].key === key) return state.groups[i];
    }
    return null;
  }

  function groupSection(key) {
    var sections = byId('config-sections').children;
    for (var i = 0; i < sections.length; i += 1) {
      if (sections[i].getAttribute('data-group-key') === key) return sections[i];
    }
    return null;
  }

  function renderAll(openKeys) {
    resetUids();
    state.diffEntries = [];
    computeDiff(state.baseline, state.draft, [], state.diffEntries);
    state.groups = buildGroups();
    if (!state.activeGroup || !groupByKey(state.activeGroup)) {
      state.activeGroup = state.groups.length ? state.groups[0].key : null;
    }
    state.renderOpenKeys = openKeys || null;
    renderNav();
    renderSections();
    if (groupByKey('forge')) {
      // These renderers look up their containers by id, so they can only fill
      // content after renderSections has attached the sections to the document.
      renderForgeRuntimeCard();
      renderForgeRegistryCard();
      renderForgeJobStatus();
    }
    refreshDiff();
  }

  function renderNav() {
    var list = byId('config-nav-list');
    var picker = byId('group-select');
    clearNode(list);
    clearNode(picker);
    state.groups.forEach(function (group) {
      var item = el('li');
      var button = el('button', 'nav-btn');
      button.type = 'button';
      button.setAttribute('data-nav-key', group.key);
      button.appendChild(el('span', 'nav-text', group.label));
      var count = el('span', 'nav-count');
      count.setAttribute('data-nav-count', group.key);
      count.hidden = true;
      button.appendChild(count);
      item.appendChild(button);
      list.appendChild(item);

      var option = el('option', '', group.label);
      option.value = group.key;
      picker.appendChild(option);
    });
  }

  function renderSections() {
    var container = byId('config-sections');
    clearNode(container);
    state.groups.forEach(function (group) {
      var section = el('section', 'config-group');
      section.setAttribute('data-group-key', group.key);
      section.setAttribute('aria-label', group.label);

      var body = el('div', 'group-body');
      if (group.key === 'providers') body.appendChild(renderProvidersGroup(group));
      else if (group.key === 'agents') body.appendChild(renderAgentsGroup(group));
      else if (group.key === 'tools') body.appendChild(renderToolsGroup(group));
      else if (group.key === 'forge') body.appendChild(renderForgeGroup(group));
      else body.appendChild(renderObjectFields(group.schema, [group.key], 1));
      section.appendChild(body);
      container.appendChild(section);
    });
    applyActiveGroup();
  }

  function applyActiveGroup() {
    state.groups.forEach(function (group) {
      var section = groupSection(group.key);
      if (section) section.hidden = group.key !== state.activeGroup;
    });
    var buttons = byId('config-nav-list').querySelectorAll('[data-nav-key]');
    for (var i = 0; i < buttons.length; i += 1) {
      if (buttons[i].getAttribute('data-nav-key') === state.activeGroup) {
        buttons[i].setAttribute('aria-current', 'true');
      } else {
        buttons[i].removeAttribute('aria-current');
      }
    }
    var picker = byId('group-select');
    if (picker.value !== state.activeGroup) picker.value = state.activeGroup;
    var group = groupByKey(state.activeGroup);
    byId('page-title').textContent = group ? group.label : '设置';
    byId('page-desc').textContent = group ? group.description : '';
    document.title = (group ? group.label + ' · ' : '') + 'PhyAgentOS 设置';
    if (state.activeGroup === 'forge' && (state.forgeRuntime.status === 'idle' || state.forgeRuntime.status === 'error')) {
      loadForgeRuntime();
    }
    if (state.activeGroup === 'forge' && state.forgeRegistry.status === 'idle') {
      loadForgeRegistry();
    }
  }

  function switchGroup(key) {
    if (!key || !groupByKey(key)) return;
    if (key === state.activeGroup) return;
    state.activeGroup = key;
    applyActiveGroup();
    window.scrollTo(0, 0);
  }

  // ---------- 代理模型与 Provider ----------

  function providerSchemaProps() {
    var providersSchema = resolveNode((state.schema && state.schema.properties && state.schema.properties.providers) || {}).node || {};
    return providersSchema.properties || {};
  }

  function allProviderKeys() {
    return Object.keys(providerSchemaProps());
  }

  function nonEmptyString(value) {
    return typeof value === 'string' && value.trim() !== '';
  }

  function providerIsConfigured(key) {
    var provider = getAt(state.draft, ['providers', key]);
    if (!isPlainObject(provider)) return false;
    if (provider.enabled === false) return false;
    if (nonEmptyString(provider.apiKey)) return true;
    if (state.secretFields['providers.' + key + '.apiKey']) return true;
    if (nonEmptyString(provider.apiBase)) return true;
    if (nonEmptyString(provider.defaultModel)) return true;
    if (Array.isArray(provider.models) && provider.models.some(nonEmptyString)) return true;
    return false;
  }

  function providerKeyFromModel(model, keys) {
    if (typeof model !== 'string') return null;
    var slash = model.indexOf('/');
    if (slash <= 0) return null;
    var prefix = model.slice(0, slash);
    var wanted = camelizeSnake(prefix);
    var found = null;
    keys.forEach(function (key) {
      if (found) return;
      if (key === prefix || key === wanted) found = key;
    });
    if (!found) {
      keys.forEach(function (key) {
        if (found) return;
        if (key.toLowerCase() === wanted.toLowerCase()) found = key;
      });
    }
    return found;
  }

  function agentProviderValue() {
    var value = getAt(state.draft, ['agents', 'defaults', 'provider']);
    if (typeof value !== 'string' || !value) return 'auto';
    return value.toLowerCase() === 'auto' ? 'auto' : value;
  }

  function currentUsedProviderKey() {
    var keys = allProviderKeys();
    var explicit = agentProviderValue();
    if (explicit === 'auto') {
      return providerKeyFromModel(getAt(state.draft, ['agents', 'defaults', 'model']), keys);
    }
    var wanted = camelizeSnake(explicit);
    var found = null;
    keys.forEach(function (key) {
      if (found) return;
      if (key === explicit || key === wanted) found = key;
    });
    if (!found) {
      keys.forEach(function (key) {
        if (found) return;
        if (key.toLowerCase() === wanted.toLowerCase()) found = key;
      });
    }
    return found;
  }

  function configuredProviderKeys() {
    var keys = allProviderKeys();
    var used = currentUsedProviderKey();
    var out = [];
    if (used && keys.indexOf(used) !== -1) out.push(used);
    keys.forEach(function (key) {
      if (key !== used && providerIsConfigured(key)) out.push(key);
    });
    return out;
  }

  function providerNameFromKey(key) {
    return String(key).replace(/([a-z0-9])([A-Z])/g, '$1_$2').toLowerCase();
  }

  function agentProviderOptionValues() {
    var values = ['auto'];
    configuredProviderKeys().forEach(function (key) {
      var value = providerNameFromKey(key);
      if (values.indexOf(value) === -1) values.push(value);
    });
    var current = agentProviderValue();
    if (current !== 'auto' && values.indexOf(current) === -1) values.push(current);
    return values;
  }

  function agentProviderOptionLabel(value) {
    if (value === 'auto') return '自动匹配（auto）';
    var keys = allProviderKeys();
    for (var i = 0; i < keys.length; i += 1) {
      if (providerNameFromKey(keys[i]) === value) return keys[i];
    }
    return value;
  }

  function agentSuggestionProviderKey() {
    var explicit = agentProviderValue();
    if (explicit !== 'auto') return currentUsedProviderKey();
    return providerKeyFromModel(getAt(state.draft, ['agents', 'defaults', 'model']), allProviderKeys());
  }

  function agentModelSuggestions() {
    var key = agentSuggestionProviderKey();
    if (!key) return [];
    var provider = getAt(state.draft, ['providers', key]);
    if (!isPlainObject(provider)) return [];
    var out = [];
    var push = function (value) {
      if (!nonEmptyString(value)) return;
      var trimmed = value.trim();
      if (out.indexOf(trimmed) === -1) out.push(trimmed);
    };
    push(provider.defaultModel);
    if (Array.isArray(provider.models)) provider.models.forEach(push);
    return out;
  }

  function renderAgentModelCard() {
    var card = el('section', 'agent-card');
    var head = el('div', 'section-head');
    head.appendChild(el('h2', 'section-title', '代理模型'));
    card.appendChild(head);

    var grid = el('div', 'agent-grid');
    grid.appendChild(renderAgentProviderField());
    grid.appendChild(renderAgentModelField());
    card.appendChild(grid);

    var follow = el('div', 'agent-follow');
    follow.appendChild(el('span', 'agent-follow-title', '子代理'));
    follow.appendChild(el('span', 'badge badge-gray', '跟随主代理'));
    follow.appendChild(el('span', 'agent-follow-note', '使用相同的Provider和模型'));
    card.appendChild(follow);
    return card;
  }

  function renderAgentProviderField() {
    var segs = ['agents', 'defaults', 'provider'];
    var shell = createFieldShell(segs);
    var id = 'agent-provider-select';
    addVisibleLabel(shell.head, id, '主代理 Provider', false);
    var select = el('select');
    select.id = id;
    select.setAttribute('data-value-type', 'string');
    select.setAttribute('data-path', JSON.stringify(segs));
    agentProviderOptionValues().forEach(function (value) {
      var option = el('option', '', agentProviderOptionLabel(value));
      option.value = value;
      select.appendChild(option);
    });
    select.value = agentProviderValue();
    shell.wrap.appendChild(select);
    shell.wrap.appendChild(el('p', 'field-note', 'auto 会根据模型前缀选择 Provider；需要固定时可直接选择。'));
    return shell.wrap;
  }

  function renderAgentModelField() {
    var segs = ['agents', 'defaults', 'model'];
    var shell = createFieldShell(segs);
    var id = 'agent-model-input';
    addVisibleLabel(shell.head, id, '主代理模型', false);
    var control = buildScalarControl(segs, schemaAtPath(segs) || { type: 'string' }, id, '主代理模型', false, false);
    if (control.tagName === 'INPUT') {
      control.setAttribute('list', 'agent-model-suggestions');
      control.placeholder = '例如 openai/gpt-4o';
    }
    shell.wrap.appendChild(control);
    var datalist = el('datalist');
    datalist.id = 'agent-model-suggestions';
    agentModelSuggestions().forEach(function (value) {
      var option = document.createElement('option');
      option.value = value;
      datalist.appendChild(option);
    });
    shell.wrap.appendChild(datalist);
    shell.wrap.appendChild(el('p', 'field-note', '填写完整模型 ID。'));
    return shell.wrap;
  }

  function refreshAgentModelSuggestions() {
    var list = byId('agent-model-suggestions');
    if (!list) return;
    clearNode(list);
    agentModelSuggestions().forEach(function (value) {
      var option = document.createElement('option');
      option.value = value;
      list.appendChild(option);
    });
  }

  function syncAgentProviderOptions() {
    var select = byId('agent-provider-select');
    if (!select) return;
    agentProviderOptionValues().forEach(function (value) {
      var exists = false;
      for (var i = 0; i < select.options.length; i += 1) {
        if (select.options[i].value === value) {
          exists = true;
          break;
        }
      }
      if (!exists) {
        var option = el('option', '', agentProviderOptionLabel(value));
        option.value = value;
        select.appendChild(option);
      }
    });
  }

  function renderProvidersGroup() {
    var fragment = document.createDocumentFragment();
    fragment.appendChild(renderAgentModelCard());
    fragment.appendChild(renderConfiguredProvidersSection());
    fragment.appendChild(renderAddProviderPanel());
    return fragment;
  }

  function buildProviderList(openKeys) {
    var list = el('div', 'provider-list');
    list.id = 'configured-provider-list';
    var keys = configuredProviderKeys();
    if (!keys.length) {
      list.appendChild(el('p', 'provider-empty', '还没有已配置的 Provider。点击“新增 Provider”添加。'));
      return list;
    }
    keys.forEach(function (key) {
      list.appendChild(renderConfiguredProviderItem(key, openKeys));
    });
    return list;
  }

  function renderConfiguredProvidersSection() {
    var section = el('section', 'provider-section');
    var head = el('div', 'section-head');
    head.appendChild(el('h2', 'section-title', '已配置 Provider'));
    var add = el('button', 'btn btn-small', '新增 Provider');
    add.type = 'button';
    add.id = 'add-provider-btn';
    add.setAttribute('data-action', 'add-provider');
    head.appendChild(add);
    section.appendChild(head);
    section.appendChild(buildProviderList(state.renderOpenKeys));
    return section;
  }

  function renderConfiguredProviderItem(key, openKeys) {
    var details = el('details', 'provider-item');
    details.setAttribute('data-provider-key', key);
    details.setAttribute('data-open-key', 'provider:' + key);
    details.open = !!(openKeys && openKeys.has('provider:' + key));

    var summary = el('summary', 'provider-summary');
    summary.appendChild(el('span', 'chevron'));
    summary.appendChild(el('span', 'provider-name', key));

    var meta = el('span', 'provider-meta');
    if (key === currentUsedProviderKey()) meta.appendChild(el('span', 'badge badge-blue', '主代理'));
    var provider = getAt(state.draft, ['providers', key]);
    var enabled = !isPlainObject(provider) || provider.enabled !== false;
    if (!enabled) {
      meta.appendChild(el('span', 'badge badge-gray', '已停用'));
    } else if (providerIsConfigured(key)) {
      meta.appendChild(el('span', 'badge badge-green', '已配置'));
    } else {
      meta.appendChild(el('span', 'badge badge-orange', '待配置'));
    }
    summary.appendChild(meta);
    details.appendChild(summary);

    var body = el('div', 'provider-body');
    body.appendChild(renderProviderEditor(key, openKeys));
    details.appendChild(body);
    return details;
  }

  function renderProviderEditor(key, openKeys) {
    var props = providerSchemaProps();
    var schema = props[key];
    if (!schema) return el('p', 'field-note', '该 Provider 不在当前配置结构中。');
    var fragment = document.createDocumentFragment();
    fragment.appendChild(renderProviderEnabledField(key));
    fragment.appendChild(renderSecretField(['providers', key, 'apiKey'], schemaAtPath(['providers', key, 'apiKey']) || {}, 'API Key', false));
    fragment.appendChild(renderProviderTextField(['providers', key, 'apiBase'], 'API 地址', '例如 https://api.example.com/v1'));

    var advanced = el('details', 'provider-advanced');
    var advancedKey = 'provider-advanced:' + key;
    advanced.setAttribute('data-open-key', advancedKey);
    advanced.open = !!(openKeys && openKeys.has(advancedKey));
    var summary = el('summary');
    summary.appendChild(el('span', 'chevron'));
    summary.appendChild(document.createTextNode('高级连接设置（通常无需修改）'));
    advanced.appendChild(summary);

    var advancedBody = el('div', 'advanced-body');
    advancedBody.appendChild(renderMapField(['providers', key, 'extraHeaders'], schemaAtPath(['providers', key, 'extraHeaders']) || {}, 'Extra Headers', false));
    if (key === 'custom' || key === 'openaiResponses') {
      advancedBody.appendChild(renderProviderNumberField(['providers', key, 'timeoutS'], '单次请求超时（秒）',
        '留空使用客户端默认值180秒；一次HTTP请求读取响应的最长等待时间。'));
      advancedBody.appendChild(renderProviderNumberField(['providers', key, 'maxRetries'], '失败重试次数',
        '留空使用客户端默认值2次；0表示不在客户端自动重试。'));
    }
    advanced.appendChild(advancedBody);
    fragment.appendChild(advanced);
    return fragment;
  }

  function renderProviderEnabledField(key) {
    var segs = ['providers', key, 'enabled'];
    var shell = createFieldShell(segs);
    var id = nextId('provider-enabled');
    addVisibleLabel(shell.head, id, '启用', false);
    var row = el('div', 'check-row');
    var checkbox = document.createElement('input');
    checkbox.type = 'checkbox';
    checkbox.id = id;
    checkbox.checked = getAt(state.draft, segs) !== false;
    checkbox.setAttribute('data-value-type', 'boolean');
    checkbox.setAttribute('data-path', JSON.stringify(segs));
    row.appendChild(checkbox);
    shell.wrap.appendChild(row);
    shell.wrap.appendChild(el('p', 'field-note', '关闭后运行时不会使用此 Provider。'));
    return shell.wrap;
  }

  function renderProviderTextField(segs, labelText, placeholder) {
    var shell = createFieldShell(segs);
    var id = nextId('provider-text');
    addVisibleLabel(shell.head, id, labelText, false);
    var control = buildScalarControl(segs, schemaAtPath(segs) || { type: 'string' }, id, labelText, false, false);
    if (placeholder && control.tagName === 'INPUT') control.placeholder = placeholder;
    shell.wrap.appendChild(control);
    return shell.wrap;
  }

  function renderProviderNumberField(segs, labelText, note) {
    var shell = createFieldShell(segs);
    var id = nextId('provider-number');
    addVisibleLabel(shell.head, id, labelText, false);
    var control = buildScalarControl(segs, schemaAtPath(segs) || { type: 'number' }, id, labelText, false, false);
    if (control.tagName === 'INPUT') control.placeholder = '留空使用默认值';
    shell.wrap.appendChild(control);
    shell.wrap.appendChild(el('p', 'field-note', note));
    return shell.wrap;
  }

  function defaultProviderObject(schema) {
    var value = defaultForSchema(schema, 0);
    if (!isPlainObject(value)) value = {};
    var props = resolveNode(schema).node.properties || {};
    Object.keys(props).forEach(function (key) {
      if (hasOwn(value, key)) return;
      var child = resolveNode(props[key]).node || {};
      if (hasOwn(child, 'default')) value[key] = clone(child.default);
      else if (child.type === 'array') value[key] = [];
    });
    return value;
  }

  function renderAddProviderPanel() {
    var panel = el('div', 'add-provider');
    panel.id = 'add-provider-area';
    panel.hidden = state.addProviderStage === 'idle';
    if (panel.hidden) return panel;
    if (state.addProviderStage === 'edit' && state.addProviderKey) {
      panel.appendChild(renderAddProviderEditor());
    } else {
      panel.appendChild(renderAddProviderChooser());
    }
    return panel;
  }

  function renderAddProviderChooser() {
    var fragment = document.createDocumentFragment();
    var head = el('div', 'add-provider-head');
    head.appendChild(el('strong', 'add-provider-title', '新增 Provider'));
    head.appendChild(el('span', 'field-note', '选择后点“继续”进入编辑；此时尚未修改草稿。'));
    fragment.appendChild(head);

    var available = allProviderKeys().filter(function (key) {
      return taken.indexOf(key) === -1;

      var option = el('option', '', key);

      select.appendChild(option);

  function renderAddProviderEditor() {
    var fragment = document.createDocumentFragment();
    var head = el('div', 'add-provider-head');
    head.appendChild(el('strong', 'add-provider-title', '新增 ' + state.addProviderKey));
    head.appendChild(el('span', 'field-note', '编辑后使用底部“保存更改”保存。'));

  function refreshAddProviderArea() {
    var old = byId('add-provider-area');

  function refreshProviderList() {
    var old = byId('configured-provider-list');
    if (!old || !old.parentNode) return;
    old.parentNode.replaceChild(buildProviderList(captureOpenKeys()), old);

  function openAddProvider() {
    if (state.addProviderStage !== 'idle') return;
    state.addProviderStage = 'choose';
    state.addProviderKey = null;
    refreshAddProviderArea();
    var select = byId('add-provider-select');
    if (select) select.focus();
  }

  function continueAddProvider() {
    var select = byId('add-provider-select');
    if (!select || !select.value) return;
    var key = select.value;
    var props = providerSchemaProps();
    if (!props[key]) return;
    var segs = ['providers', key];
    if (!isPlainObject(getAt(state.draft, segs))) {
      setAt(state.draft, segs, defaultProviderObject(props[key]));
    }
    state.addProviderKey = key;
    state.addProviderStage = 'edit';
    refreshAddProviderArea();
    refreshDiff();
  }

  function restoreProviderDraft(key) {
    var segs = ['providers', key];
    var baselineProviders = getAt(state.baseline, ['providers']);
    if (isPlainObject(baselineProviders) && hasOwn(baselineProviders, key)) {
      setAt(state.draft, segs, clone(baselineProviders[key]));
    } else {
      deleteAt(state.draft, segs);
    }
    var prefix = 'providers.' + key + '.';
    Array.from(state.clearSecrets).forEach(function (path) {
      if (path.indexOf(prefix) === 0) state.clearSecrets.delete(path);
    });
    Array.from(state.jsonErrors.keys()).forEach(function (path) {
      if (path === 'providers.' + key || path.indexOf(prefix) === 0) state.jsonErrors.delete(path);
    });
  }

  function cancelAddProvider() {
    if (state.addProviderStage === 'edit' && state.addProviderKey) {
      restoreProviderDraft(state.addProviderKey);
    }
    state.addProviderStage = 'idle';
    state.addProviderKey = null;
    refreshProviderList();
    refreshAddProviderArea();
    refreshAgentModelSuggestions();
    refreshDiff();
  }

  function afterAgentModelChoice() {
    refreshAgentModelSuggestions();
    syncAgentProviderOptions();
    refreshProviderList();
    if (state.addProviderStage === 'choose') refreshAddProviderArea();
    refreshDiff();
  }
