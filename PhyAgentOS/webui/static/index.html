  function renderForgeSkillItem(skill, index) {
    var info = skill || {};
    var name = typeof info.name === 'string' && info.name ? info.name : '（未命名 Skill）';
    var openKey = 'forge:skill:' + name;
    var details = el('details', 'provider-item');
    details.setAttribute('data-open-key', openKey);
    details.open = state.renderOpenKeys ? state.renderOpenKeys.has(openKey) : index === 0;

    var summary = el('summary', 'provider-summary');
    summary.appendChild(el('span', 'chevron'));
    summary.appendChild(el('span', 'provider-name', name));
    var meta = el('span', 'provider-meta');
    if (info.version) meta.appendChild(el('span', 'badge badge-gray', 'v' + info.version));
    meta.appendChild(el('span', 'badge ' + forgeStatusBadgeClass(info.status), forgeStatusLabel(info.status)));
    summary.appendChild(meta);
    details.appendChild(summary);

    var body = el('div', 'provider-body');
    if (info.description) body.appendChild(el('p', 'field-note', info.description));

    var statusText = forgeStatusLabel(info.status);
    if (info.profile) statusText += ' · profile ' + info.profile;
    body.appendChild(forgeRow('运行状态', statusText));

    var times = [];
    if (info.startedAt) times.push('启动于 ' + info.startedAt);
    if (info.updatedAt) times.push('更新于 ' + info.updatedAt);
    if (times.length) body.appendChild(el('p', 'field-note', times.join(' · ')));

    if (info.gatewayUrl) body.appendChild(forgeRow('Gateway 地址', info.gatewayUrl));

    var tools = Array.isArray(info.tools) ? info.tools : [];
    body.appendChild(forgeRow('工具', tools.length ? tools.join(', ') : '未声明'));

    var nodes = Array.isArray(info.nodes) ? info.nodes : [];
    if (nodes.length) {
      var nodeRow = el('div', 'forge-row');
      nodeRow.appendChild(el('span', 'forge-row-label', 'Node'));
      var nodeValues = el('span', 'forge-row-value');
      nodes.forEach(function (node) {
        var item = el('span', 'forge-node-item');
        var nodeText = String(node && node.nodeId ? node.nodeId : '未知');
        if (node && node.version) nodeText += ' v' + node.version;
        item.appendChild(el('span', '', nodeText));
        item.appendChild(el('span', 'badge ' + (node && node.installed ? 'badge-blue' : 'badge-gray'),
          node && node.installed ? '已安装' : '未安装'));
        nodeValues.appendChild(item);
      });
      nodeRow.appendChild(nodeValues);
      body.appendChild(nodeRow);
    }

    if (info.lastError) body.appendChild(el('p', 'forge-invalid', '最近错误：' + info.lastError));

    if (state.forgeActionsEnabled && !forgeJobRunning()) {
      var removeButton = el('button', 'btn btn-small btn-danger forge-remove', '删除此 Skill');
      removeButton.type = 'button';
      removeButton.setAttribute('data-action', 'forge-skill-remove');
      removeButton.setAttribute('data-skill-name', name);
      body.appendChild(removeButton);
    }

    var activeInvocations = Number(info.activeInvocations) || 0;
    var activeSessions = Number(info.activeSessions) || 0;
    var activeTaskBindings = Number(info.activeTaskBindings) || 0;
    if (activeInvocations > 0 || activeSessions > 0 || activeTaskBindings > 0) {
      body.appendChild(el('p', 'field-note',
        '进行中调用 ' + activeInvocations + ' · 会话 ' + activeSessions + ' · 任务绑定 ' + activeTaskBindings));
    }

    details.appendChild(body);
    return details;
  }

  function renderForgeRuntimeCard() {
    var container = byId('forge-runtime');
    if (!container) return;
    clearNode(container);
    var runtime = state.forgeRuntime;

    if (runtime.status === 'loading' || runtime.status === 'idle') {
      container.appendChild(el('p', 'provider-empty', '正在读取已安装的 Skill…'));
      return;
    }

    if (runtime.status === 'error') {
      container.appendChild(el('p', 'provider-empty', runtime.error || '无法读取 Forge Skill 信息。'));
      var retry = el('button', 'btn btn-small', '重试');
      retry.type = 'button';
      retry.setAttribute('data-action', 'reload-forge-runtime');
      container.appendChild(retry);
      return;
    }

    var data = runtime.data || {};
    var skills = Array.isArray(data.skills) ? data.skills : [];
    var invalid = Array.isArray(data.invalid) ? data.invalid : [];
    if (!skills.length) {
      container.appendChild(el('p', 'provider-empty',
        '尚未安装 Forge Skill；可用 paos skill install <name> 安装，Node 用 paos forge-node install 安装。'));
    } else {
      var list = el('div', 'provider-list');
      skills.forEach(function (skill, index) {
        list.appendChild(renderForgeSkillItem(skill, index));
      });
      container.appendChild(list);
    }
    invalid.forEach(function (entry) {
      var name = entry && entry.name ? entry.name : '（未知）';
      var error = entry && entry.error ? entry.error : '未知错误';
      container.appendChild(el('p', 'forge-invalid', 'Skill ' + name + ' 清单无效：' + error));
    });
  }

  async function loadForgeRuntime() {
    state.forgeRuntime.status = 'loading';
    state.forgeRuntime.error = null;
    renderForgeRuntimeCard();
    try {
      var result = await requestJson('/api/forge/runtime');
      if (!result.ok) {
        state.forgeRuntime.status = 'error';
        state.forgeRuntime.error = extractError(result);
      } else if (!result.data || !Array.isArray(result.data.skills)) {
        state.forgeRuntime.status = 'error';
        state.forgeRuntime.error = '接口返回的数据格式不正确。';
      } else {
        state.forgeRuntime.status = 'ready';
        state.forgeRuntime.data = result.data;
        state.forgeActionsEnabled = !!result.data.actionsEnabled;
        if (state.forgeRegistry.status === 'ready') renderForgeRegistryCard();
        if (state.forgeActionsEnabled && !state.forgeJob) {
          requestJson('/api/forge/jobs/current').then(function (res) {
            if (res.ok && res.data && res.data.job) {
              state.forgeJob = res.data.job;
              renderForgeJobStatus();
              renderForgeRuntimeCard();
              renderForgeRegistryCard();
              if (state.forgeJob.status === 'running') pollForgeJob(state.forgeJob.jobId);
            }
          }).catch(function () { /* ignore */ });
        }
      }
    } catch (error) {
      state.forgeRuntime.status = 'error';
      state.forgeRuntime.error = error && error.code === 'timeout'
        ? '读取 Forge Skill 超时，请稍后重试。'
        : '无法连接后端，请确认服务仍在运行后重试。';
    }
    if (state.activeGroup === 'forge') renderForgeRuntimeCard();
  }

  function renderForgeRegistryCard() {
    var container = byId('forge-registry');
    if (!container) return;
    clearNode(container);
    var registry = state.forgeRegistry;

    if (registry.status === 'loading' || registry.status === 'idle') {
      container.appendChild(el('p', 'provider-empty', '正在查询仓库…'));
      return;
    }

    if (registry.status === 'error') {
      container.appendChild(el('p', 'forge-invalid', registry.error || '无法查询 Skill 仓库。'));
      var retry = el('button', 'btn btn-small', '重试');
      retry.type = 'button';
      retry.setAttribute('data-action', 'search-registry');
      container.appendChild(retry);
      return;
    }

    var data = registry.data || {};
    var items = Array.isArray(data.items) ? data.items : [];
    if (data.sourceUrl) {
      container.appendChild(el('p', 'forge-registry-source', '仓库地址：' + data.sourceUrl));
    }
    if (!items.length) {
      container.appendChild(el('p', 'provider-empty', '仓库没有匹配的 Skill。'));
      return;
    }
    var list = el('div', 'provider-list');
    items.forEach(function (item) {
      var row = el('div', 'forge-registry-row');
      var name = el('strong', 'forge-registry-name', item.name || '（未知）');
      row.appendChild(name);
      if (item.version) {
        row.appendChild(el('span', 'badge badge-gray', 'v' + item.version));
      }
      if (item.installedVersion) {
        if (item.updateAvailable) {
          row.appendChild(el('span', 'badge badge-orange', '可更新'));
        } else {
          row.appendChild(el('span', 'badge badge-blue', '已安装'));
        }
      } else {
        row.appendChild(el('span', 'badge badge-gray', '未安装'));
      }
      if (state.forgeActionsEnabled && item.name && item.version) {
        var action = null;
        var label = '';
        if (!item.installedVersion) { action = 'forge-skill-install'; label = '安装'; }
        else if (item.updateAvailable) { action = 'forge-skill-update'; label = '更新'; }
        if (action) {
          var button = el('button', 'btn btn-small', label);
          button.type = 'button';
          button.setAttribute('data-action', action);
          button.setAttribute('data-skill-name', item.name);
          button.setAttribute('data-skill-version', item.version);
          if (forgeJobRunning()) button.disabled = true;
          row.appendChild(button);
        }
      }
      if (item.description) {
        row.appendChild(el('span', 'forge-registry-desc', item.description));
      }
      if (item.updateAvailable) {
        row.appendChild(el('span', 'forge-registry-note',
          '已安装 v' + item.installedVersion + '，仓库版本 v' + item.version));
      }
      list.appendChild(row);
    });
    container.appendChild(list);
  }

  function forgeJobRunning() {
    return !!(state.forgeJob && state.forgeJob.status === 'running');
  }

  function forgeKindLabel(kind) {
    if (kind === 'install') return '安装';
    if (kind === 'update') return '更新';
    if (kind === 'remove') return '删除';
    return kind;
  }

  function renderForgeJobStatus() {
    var container = byId('forge-job-status');
    if (!container) return;
    clearNode(container);
    if (!state.forgeActionsEnabled) {
      container.appendChild(el('p', 'field-note',
        '未启用页面内 Skill 操作；以 paos web --allow-skill-actions 启动后，可在此安装、更新或删除 Skill（Node 也可用 paos forge-node install 单独安装）。'));
      return;
    }
    var job = state.forgeJob;
    if (!job) {
      container.appendChild(el('p', 'field-note',
        '安装会同时下载 Skill 锁定的 Forge Node；运行中的 Skill 需先停止才能更新或删除。'));
      return;
    }
    var head = forgeKindLabel(job.kind) + ' ' + job.name + (job.version ? ' v' + job.version : '');
    if (job.status === 'running') {
      container.appendChild(el('p', 'provider-empty',
        head + '：' + job.step + (job.detail ? ' · ' + job.detail : '') + '…'));
      return;
    }
    if (job.status === 'error') {
      container.appendChild(el('p', 'forge-invalid', head + '失败：' + (job.error || '未知错误')));
      return;
    }
    if (job.status === 'cancelled') {
      container.appendChild(el('p', 'provider-empty', head + '已取消。'));
      return;
    }
    container.appendChild(el('p', 'field-note', head + '：' + (job.message || '完成')));
  }

  function confirmForgeAction(action, name, version) {
    var kind = action === 'forge-skill-install' ? 'install'
      : action === 'forge-skill-update' ? 'update' : 'remove';
    var title = kind === 'install' ? '安装 Skill' : kind === 'update' ? '更新 Skill' : '删除 Skill';
    var label = kind === 'install' ? '安装' : kind === 'update' ? '更新' : '删除';
    var message;
    if (kind === 'remove') {
      message = '将删除已安装的 ' + name + '，此操作不可撤销。';
    } else {
      message = '将把 ' + name + (version ? ' 更新/安装到仓库版本 v' + version : '')
        + '。安装与更新会下载锁定的 Forge Node，且要求该 Skill 已停止。';
    }
    openConfirm({
      title: title,
      message: message,
      confirmLabel: label,
      danger: kind === 'remove',
      focusConfirm: false,
      onConfirm: function () { startForgeJob(kind, name, version); }
    });
  }

  function startForgeJob(kind, name, version) {
    var payload = { name: name };
    if (version) payload.version = version;
    requestJson('/api/forge/skills/' + kind, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    }).then(function (result) {
      if (!result.ok) {
        showErrorNotice(extractError(result));
        return;
      }
      if (result.data && result.data.job) {
        state.forgeJob = result.data.job;
        renderForgeJobStatus();
        renderForgeRuntimeCard();
        renderForgeRegistryCard();
        pollForgeJob(result.data.job.jobId);
      }
    }).catch(function (error) {
      showErrorNotice(error && error.code === 'timeout'
        ? '请求超时，请稍后重试。'
        : '无法连接后端，请确认服务仍在运行。');
    });
  }

  function pollForgeJob(jobId) {
    if (state.forgePollId === jobId) return;
    state.forgePollId = jobId;
    var tick = async function () {
      var job = state.forgeJob;
      if (job && job.jobId === jobId && job.status === 'running') {
        try {
          var result = await requestJson('/api/forge/jobs/' + jobId);
          if (result.ok && result.data && result.data.job) state.forgeJob = result.data.job;
        } catch (error) { /* keep last state */ }
        renderForgeJobStatus();
        renderForgeRuntimeCard();
        renderForgeRegistryCard();
        window.setTimeout(tick, 800);
        return;
      }
      state.forgePollId = null;
      renderForgeJobStatus();
      renderForgeRuntimeCard();
      renderForgeRegistryCard();
      job = state.forgeJob;
      if (job && job.jobId === jobId) {
        if (job.status === 'done' && job.message) showSuccessNotice(job.message);
        else if (job.status === 'error') showErrorNotice(job.error || '任务失败。');
      }
      if (state.activeGroup === 'forge') {
        loadForgeRuntime();
        if (state.forgeRegistry.status === 'ready') loadForgeRegistry();
      }
    };
    tick();
  }

  async function loadForgeRegistry() {
    var input = document.querySelector('[data-group-key="forge"] [data-registry-input]');
    if (input) state.forgeRegistry.query = input.value.trim();
    state.forgeRegistry.status = 'loading';
    state.forgeRegistry.error = null;
    renderForgeRegistryCard();
    var url = '/api/forge/registry' + (state.forgeRegistry.query
      ? '?query=' + encodeURIComponent(state.forgeRegistry.query)
      : '');
    try {
      var result = await requestJson(url);
      if (!result.ok) {
        state.forgeRegistry.status = 'error';
        state.forgeRegistry.error = extractError(result);
      } else if (!result.data || !Array.isArray(result.data.items)) {
        state.forgeRegistry.status = 'error';
        state.forgeRegistry.error = '接口返回的数据格式不正确。';
      } else {
        state.forgeRegistry.status = 'ready';
        state.forgeRegistry.data = result.data;
      }
    } catch (error) {
      state.forgeRegistry.status = 'error';
      state.forgeRegistry.error = error && error.code === 'timeout'
        ? '查询仓库超时，请稍后重试。'
        : '无法连接后端，请确认服务仍在运行后重试。';
    }
    if (state.activeGroup === 'forge') renderForgeRegistryCard();
  }

  function renderObjectFields(rawSchema, segs, depth) {
    var resolved = resolveNode(rawSchema);
    var node = resolved.node || {};
    var props = node.properties || {};
    var fragment = document.createDocumentFragment();
    var required = node.required || [];

    Object.keys(props).forEach(function (key) {
      var childSegs = segs.concat(key);
      if (isHiddenSchemaPath(childSegs)) return;
      fragment.appendChild(renderField(key, props[key], childSegs, depth, required.indexOf(key) !== -1));
    });

    var current = getAt(state.draft, segs);
    if (isPlainObject(current)) {
      var extraKeys = Object.keys(current).filter(function (key) { return !hasOwn(props, key); });
      if (extraKeys.length) {
        fragment.appendChild(el('p', 'field-note field-wide',
          '包含 ' + extraKeys.length + ' 个未在 schema 中定义的字段；页面会原样保留它们，但不在表单中逐项编辑。'));
      }
    }
    return fragment;
  }

  function appendRequired(label, isRequired) {
    if (!isRequired) return;
    var star = el('span', 'req', '*');
    star.setAttribute('aria-hidden', 'true');
    label.appendChild(star);
    var hidden = el('span', 'sr-only', '（必填）');
    label.appendChild(hidden);
  }

  function appendFieldDescription(wrap, rawSchema) {
    var desc = schemaDescription(rawSchema);
    if (desc) wrap.appendChild(el('p', 'field-desc', desc));
  }

  function appendFieldMeta(wrap, rawSchema, opts) {
    var options = opts || {};
    var resolved = resolveNode(rawSchema);
    var node = resolved.node || {};
    var notes = [];
    if (options.required) notes.push('必填');
    if (!options.secret && hasOwn(node, 'default')) {
      notes.push('默认：' + formatValue(node.default, 60));
    }
    if (resolved.nullable) notes.push('可留空，保存为 null');
    if (typeof node.minimum === 'number') notes.push('最小值 ' + node.minimum);
    if (typeof node.maximum === 'number') notes.push('最大值 ' + node.maximum);
    if (typeof node.exclusiveMinimum === 'number') notes.push('必须大于 ' + node.exclusiveMinimum);
    if (typeof node.exclusiveMaximum === 'number') notes.push('必须小于 ' + node.exclusiveMaximum);
    if (typeof node.minLength === 'number') notes.push('最短 ' + node.minLength + ' 字符');
    if (typeof node.maxLength === 'number') notes.push('最长 ' + node.maxLength + ' 字符');
    if (typeof node.minItems === 'number') notes.push('至少 ' + node.minItems + ' 项');
    if (typeof node.maxItems === 'number') notes.push('最多 ' + node.maxItems + ' 项');
    if (Array.isArray(node.enum)) notes.push('可选值：' + node.enum.map(function (item) { return formatValue(item, 30); }).join('、'));
    if (notes.length) wrap.appendChild(el('p', 'field-note', notes.join(' · ')));
  }

  function createFieldShell(segs) {
    var wrap = el('div', 'field');
    wrap.setAttribute('data-field-path', pathKey(segs));
    var head = el('div', 'field-head');
    var stateSpan = el('span', 'field-state');
    stateSpan.hidden = true;
    head.appendChild(stateSpan);
    wrap.appendChild(head);
    return { wrap: wrap, head: head, stateSpan: stateSpan };
  }

  function addVisibleLabel(head, targetId, text, isRequired) {
    var label = el('label', 'field-label');
    if (targetId) label.htmlFor = targetId;
    label.classList.add('req-label');
    label.appendChild(document.createTextNode(text));
    appendRequired(label, isRequired);
    head.insertBefore(label, head.firstChild);
    return label;
  }

  function addTextLabel(head, text, isRequired) {
    var label = el('span', 'field-label');
    label.appendChild(document.createTextNode(text));
    appendRequired(label, isRequired);
    head.insertBefore(label, head.firstChild);
    return label;
  }

  function renderField(propKey, rawSchema, segs, depth, isRequired) {
    var resolved = resolveNode(rawSchema);
    var node = resolved.node || {};
    var labelText = humanize(propKey);
    if (segs[0] === 'tools' && segs[1] === 'mcpServers' && hasOwn(MCP_FIELD_LABELS, propKey)) {
      labelText = MCP_FIELD_LABELS[propKey];
    }
    var secret = secretInfo(segs);

    if (secret) return renderSecretField(segs, rawSchema, labelText, isRequired);

    if (resolved.unionComplex) {
      return renderJsonField(segs, rawSchema, labelText, isRequired, '复杂联合类型使用 JSON 编辑。');
    }

    if (node.type === 'object' || node.properties) {
      var props = node.properties || {};
      if (Object.keys(props).length) {
        return renderObjectDetails(rawSchema, segs, depth, labelText, isRequired);
      }
      if (node.additionalProperties && typeof node.additionalProperties === 'object') {
        return renderMapField(segs, rawSchema, labelText, isRequired);
      }
      return renderJsonField(segs, rawSchema, labelText, isRequired, '该对象没有固定字段，使用 JSON 编辑。');
    }

    if (node.type === 'array') {
      if (!node.items || typeof node.items !== 'object') {
        return renderJsonField(segs, rawSchema, labelText, isRequired, '数组项类型未在 schema 中明确，使用 JSON 编辑。');
      }
      var itemResolved = resolveNode(node.items);
      if (itemResolved.unionComplex || (!itemResolved.node.type && !itemResolved.node.properties)) {
        return renderJsonField(segs, rawSchema, labelText, isRequired, '数组项是复杂联合类型，使用 JSON 编辑。');
      }
      return renderArrayField(segs, rawSchema, labelText, isRequired);
    }

    return renderScalarField(segs, rawSchema, labelText, isRequired);
  }

  function renderObjectDetails(rawSchema, segs, depth, labelText, isRequired) {
    var path = pathKey(segs);
    var details = el('details', 'object-block');
    details.setAttribute('data-open-key', 'obj:' + path);
    if (hasDiff(path) && state.renderOpenKeys !== null) details.open = true;

    var summary = el('summary');
    summary.appendChild(el('span', 'chevron'));
    var main = el('span', 'obj-main');
    var label = el('span', 'obj-label');
    label.appendChild(document.createTextNode(labelText));
    appendRequired(label, isRequired);
    main.appendChild(label);
    var desc = schemaDescription(rawSchema);
    if (desc) main.appendChild(el('span', 'obj-desc', desc));
    summary.appendChild(main);

    var meta = el('span', 'obj-meta');
    var diffBadge = el('span', 'badge badge-orange');
    diffBadge.setAttribute('data-badge-for', path);
    diffBadge.hidden = true;
    meta.appendChild(diffBadge);
    summary.appendChild(meta);

    details.appendChild(summary);
    var body = el('div', 'object-body');
    body.appendChild(renderObjectFields(rawSchema, segs, depth + 1));
    details.appendChild(body);
    return details;
  }

  function renderScalarField(segs, rawSchema, labelText, isRequired) {
    var resolved = resolveNode(rawSchema);
    var node = resolved.node || {};
    var shell = createFieldShell(segs);
    var id = nextId('field');
    addVisibleLabel(shell.head, id, labelText, isRequired);
    appendFieldDescription(shell.wrap, rawSchema);

    var control = buildScalarControl(segs, rawSchema, id, labelText, isRequired, false);
    shell.wrap.appendChild(control);
    appendFieldMeta(shell.wrap, rawSchema, { required: isRequired });
    return shell.wrap;
  }

  function buildScalarControl(segs, rawSchema, id, labelText, isRequired, inline) {
    var resolved = resolveNode(rawSchema);
    var node = resolved.node || {};
    var value = getAt(state.draft, segs);
    if (value === undefined) value = defaultForSchema(rawSchema, 0);

    if (hasOwn(node, 'const')) {
      var constInput = document.createElement('input');
      constInput.type = 'text';
      if (id) constInput.id = id;
      if (inline) constInput.setAttribute('aria-label', labelText);
      constInput.disabled = true;
      constInput.value = typeof node.const === 'string' ? node.const : JSON.stringify(node.const);
      return constInput;
    }

    if (Array.isArray(node.enum) && node.enum.length) {
      var select = el('select');
      if (id) select.id = id;
      if (inline) select.setAttribute('aria-label', labelText);
      select.setAttribute('data-value-type', 'enum');
      select.setAttribute('data-path', JSON.stringify(segs));
      var enumType = node.type || typeof node.enum[0];
      select.setAttribute('data-enum-type', enumType);
      if (resolved.nullable) {
        var nullOption = el('option', '', '（空 / null）');
        nullOption.value = '__null__';
        select.appendChild(nullOption);
      }
      var found = false;
      node.enum.forEach(function (optionValue) {
        var option = el('option', '', formatValue(optionValue, 60));
        option.value = String(optionValue);
        if (value === optionValue || String(value) === String(optionValue)) {
          option.selected = true;
          found = true;
        }
        select.appendChild(option);
      });
      if (!found && value !== null && value !== undefined) {
        var currentOption = el('option', '', '当前值：' + formatValue(value, 60));
        currentOption.value = String(value);
        currentOption.selected = true;
        select.appendChild(currentOption);
      }
      if (resolved.nullable && value === null) select.value = '__null__';
      return select;
    }

    if (node.type === 'boolean') {
      var row = el('div', 'check-row');
      var checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      if (id) checkbox.id = id;
      if (inline) checkbox.setAttribute('aria-label', labelText);
      checkbox.checked = value === true;
      checkbox.setAttribute('data-value-type', 'boolean');
      checkbox.setAttribute('data-path', JSON.stringify(segs));
      row.appendChild(checkbox);
      row.appendChild(el('span', 'check-text', '开启'));
      return row;
    }

    if (node.type === 'integer' || node.type === 'number') {
      var numberInput = document.createElement('input');
      numberInput.type = 'number';
      if (id) numberInput.id = id;
      if (inline) numberInput.setAttribute('aria-label', labelText);
      numberInput.setAttribute('data-value-type', node.type);
      numberInput.setAttribute('data-path', JSON.stringify(segs));
      numberInput.step = node.type === 'integer' ? '1' : 'any';
      if (typeof node.minimum === 'number') numberInput.min = String(node.minimum);
      if (typeof node.maximum === 'number') numberInput.max = String(node.maximum);
      if (typeof node.exclusiveMinimum === 'number') numberInput.min = String(node.exclusiveMinimum);
      if (typeof node.exclusiveMaximum === 'number') numberInput.max = String(node.exclusiveMaximum);
      if (value !== null && value !== undefined) numberInput.value = String(value);
      var unitScale = unitScaleFor(segs);
      if (unitScale > 1) {
        numberInput.setAttribute('data-unit-scale', String(unitScale));
        numberInput.step = '1';
        numberInput.min = '1';
        if (value !== null && value !== undefined) {
          numberInput.value = String(Math.round((Number(value) || 0) / unitScale));
        }
      }
      if (resolved.nullable) numberInput.placeholder = '留空 = null';
      if (isRequired && !resolved.nullable) numberInput.required = true;
      return numberInput;
    }

    var input = document.createElement('input');
    input.type = 'text';
    if (id) input.id = id;
    if (inline) input.setAttribute('aria-label', labelText);
    input.setAttribute('data-value-type', 'string');
    input.setAttribute('data-path', JSON.stringify(segs));
    input.autocomplete = 'off';
    input.spellcheck = false;
    if (value !== null && value !== undefined) input.value = String(value);
    if (resolved.nullable) input.placeholder = '留空 = null';
    if (typeof node.maxLength === 'number') input.maxLength = node.maxLength;
    if (isRequired && !resolved.nullable) input.required = true;
    return input;
  }

  function renderSecretField(segs, rawSchema, labelText, isRequired) {
    var info = secretInfo(segs);
    var canonical = info ? info.key : canonicalSecretPath(segs);
    var configured = info ? info.configured : false;
    var cleared = state.clearSecrets.has(canonical) && configured;
    var shell = createFieldShell(segs);
    var id = nextId('secret');
    var wrap = shell.wrap;
    wrap.classList.add('field-secret');

    var label = addVisibleLabel(shell.head, id, labelText, isRequired);
    var status = el('span', configured ? 'badge badge-blue' : 'badge badge-gray', configured ? '已配置' : '未配置');
    status.setAttribute('data-secret-status', '1');
    shell.head.appendChild(status);
    appendFieldDescription(wrap, rawSchema);

    var box = el('div', 'secret-box');
    var input = document.createElement('input');
    input.type = 'password';
    input.id = id;
    input.autocomplete = 'new-password';
    input.spellcheck = false;
    input.setAttribute('data-value-type', 'secret');
    input.setAttribute('data-path', JSON.stringify(segs));
    input.setAttribute('data-secret-key', canonical);
    input.setAttribute('data-secret-configured', configured ? '1' : '0');
    var current = getAt(state.draft, segs);
    if (typeof current === 'string' && current !== '') input.value = current;

    if (cleared) {
      input.disabled = true;
      input.placeholder = '保存后将清除该密钥';
    } else if (configured) {
      input.placeholder = '留空保持不变';
    } else {
      input.placeholder = '留空则不设置';
    }
    box.appendChild(input);

    var hint = configured
      ? '留空保留原密钥；输入新值则替换。'
      : '尚未配置密钥；留空保存不会添加。';
    box.appendChild(el('p', 'field-note', hint));

    var clearRow = el('div', 'secret-clear');
    var clearCheckbox = document.createElement('input');
    clearCheckbox.type = 'checkbox';
    clearCheckbox.id = nextId('secret-clear');
    clearCheckbox.checked = cleared;
    clearCheckbox.disabled = !configured;
    clearCheckbox.setAttribute('data-clear-secret', canonical);
    clearCheckbox.setAttribute('data-path', JSON.stringify(segs));
    if (!configured) clearCheckbox.setAttribute('aria-disabled', 'true');
    var clearLabel = el('label', '', '清除已配置的密钥');
    clearLabel.htmlFor = clearCheckbox.id;
    clearRow.appendChild(clearCheckbox);
    clearRow.appendChild(clearLabel);
    if (!configured) clearRow.appendChild(el('span', 'field-note', '（当前未配置，无需清除）'));
    box.appendChild(clearRow);
    wrap.appendChild(box);

    appendFieldMeta(wrap, rawSchema, { required: isRequired, secret: true });
    return wrap;
  }

  function directMapError(editor) {
    if (!editor) return null;
    for (var i = 0; i < editor.children.length; i += 1) {

  function renderMapField(segs, rawSchema, labelText, isRequired) {
    var shell = createFieldShell(segs);

  function buildMapEditor(segs, rawSchema) {
    var resolved = resolveNode(rawSchema);
    var node = resolved.node || {};
    var additional = node.additionalProperties;
    var valueSchema = (additional && typeof additional === 'object') ? additional : { type: 'string' };
    var mapValue = getAt(state.draft, segs);
    if (!isPlainObject(mapValue)) mapValue = {};
    var path = pathKey(segs);

    var editor = el('div', 'map-editor');
    editor.setAttribute('data-map-editor', path);
    var list = el('div', 'map-list');
    var keys = Object.keys(mapValue);

    if (!keys.length) {
      list.appendChild(el('p', 'collection-empty', '暂无键值；可在下方添加。'));
    }

    keys.forEach(function (key) {
      var row = el('div', 'map-row');
      var keyCell = el('div', 'map-key');
      var keyInput = document.createElement('input');
      keyInput.type = 'text';
      keyInput.value = key;
      keyInput.setAttribute('data-map-key-input', '1');
      keyInput.setAttribute('data-old-key', key);
      keyInput.setAttribute('data-map-path', JSON.stringify(segs));
      keyInput.setAttribute('aria-label', '键名：' + key);
      keyCell.appendChild(keyInput);
      row.appendChild(keyCell);

      var valueCell = el('div', 'map-value');
      valueCell.appendChild(renderInlineValue(segs.concat(key), valueSchema, 0, key));
      row.appendChild(valueCell);

      var removeButton = el('button', 'btn btn-small btn-danger', '删除');
      removeButton.type = 'button';
      removeButton.setAttribute('data-action', 'remove-map-entry');
      removeButton.setAttribute('data-map-path', JSON.stringify(segs));
      removeButton.setAttribute('data-map-key', key);
      removeButton.setAttribute('aria-label', '删除键 ' + key);
      row.appendChild(removeButton);
      list.appendChild(row);
    });

    editor.appendChild(list);

    var addRow = el('div', 'map-add');
    var newKeyInput = document.createElement('input');
    newKeyInput.type = 'text';
    newKeyInput.placeholder = '新键名';
    newKeyInput.setAttribute('data-map-new-key', '1');
    newKeyInput.setAttribute('data-map-path', JSON.stringify(segs));
    newKeyInput.setAttribute('aria-label', '新键名');
    addRow.appendChild(newKeyInput);
    var addButton = el('button', 'btn btn-small', '添加一项');
    addButton.type = 'button';
    addButton.setAttribute('data-action', 'add-map-entry');
    addButton.setAttribute('data-map-path', JSON.stringify(segs));
    addRow.appendChild(addButton);
    editor.appendChild(addRow);
    editor.appendChild(el('p', 'map-error', ''));
    editor.querySelector('.map-error').hidden = true;
    return editor;
  }

  function buildMcpEditor(segs, rawSchema) {
    var resolved = resolveNode(rawSchema);
    var node = resolved.node || {};
    var additional = node.additionalProperties;
    var valueSchema = (additional && typeof additional === 'object') ? additional : { type: 'string' };
    var mapValue = getAt(state.draft, segs);
    if (!isPlainObject(mapValue)) mapValue = {};
    var path = pathKey(segs);

    var editor = el('div', 'map-editor');

    var list = el('div', '');
    var keys = Object.keys(mapValue);

    if (!keys.length) {

    keys.forEach(function (key) {
      var item = el('details', 'provider-item');
      var openKey = 'mcp:' + path + ':' + key;
      item.setAttribute('data-open-key', openKey);

      var summary = el('summary', 'provider-summary');
      summary.appendChild(el('span', 'chevron'));
      summary.appendChild(el('strong', 'provider-name', key));

      if (entry.type) {
        var meta = el('span', 'provider-meta');

      item.appendChild(summary);

      var body = el('div', 'provider-body');
      var keyField = el('div', 'field');

      var keyLabel = el('label', 'field-label', '名称');

      keyHead.appendChild(keyLabel);
      keyField.appendChild(keyHead);
      var keyInput = document.createElement('input');
      keyInput.type = 'text';
      keyInput.id = keyId;
      keyInput.value = key;
      keyInput.setAttribute('data-map-key-input', '1');
      keyInput.setAttribute('data-old-key', key);
      keyInput.setAttribute('data-map-path', JSON.stringify(segs));

      body.appendChild(keyField);

      body.appendChild(renderInlineValue(segs.concat(key), valueSchema, 0, key));

      body.appendChild(removeButton);

      item.appendChild(body);
      list.appendChild(item);
    });

    editor.appendChild(list);

    var addRow = el('div', 'map-add');
    var newKeyInput = document.createElement('input');
    newKeyInput.type = 'text';
    newKeyInput.placeholder = '新 Server 名称';
    newKeyInput.setAttribute('data-map-new-key', '1');
    newKeyInput.setAttribute('data-map-path', JSON.stringify(segs));
    newKeyInput.setAttribute('aria-label', '新 Server 名称');
    addRow.appendChild(newKeyInput);
    var addButton = el('button', 'btn btn-small', '添加一项');
    addButton.type = 'button';
    addButton.setAttribute('data-action', 'add-map-entry');
    addButton.setAttribute('data-map-path', JSON.stringify(segs));
    addRow.appendChild(addButton);
    editor.appendChild(addRow);
    editor.appendChild(el('p', 'map-error', ''));
    editor.querySelector('.map-error').hidden = true;
    return editor;

  function renderArrayField(segs, rawSchema, labelText, isRequired) {
    var shell = createFieldShell(segs);
    addTextLabel(shell.head, labelText, isRequired);
    appendFieldDescription(shell.wrap, rawSchema);
    shell.wrap.appendChild(buildArrayEditor(segs, rawSchema));
    appendFieldMeta(shell.wrap, rawSchema, { required: isRequired });
    return shell.wrap;
  }

  function buildArrayEditor(segs, rawSchema) {
    var resolved = resolveNode(rawSchema);
    var node = resolved.node || {};
    var itemsSchema = node.items || {};
    var itemResolved = resolveNode(itemsSchema);
    var itemHasFields = !!(itemResolved.node.properties && Object.keys(itemResolved.node.properties).length);
    var arrayValue = getAt(state.draft, segs);
    if (!Array.isArray(arrayValue)) arrayValue = [];
    var path = pathKey(segs);

    var editor = el('div', 'collection');
    var list = el('div', 'collection-list');

    if (!arrayValue.length) {
      list.appendChild(el('p', 'collection-empty', '暂无条目；可在下方添加。'));
    }

    arrayValue.forEach(function (item, index) {
      var itemSegs = segs.concat(index);
      if (itemHasFields) {
        var card = el('div', 'array-card');
        var head = el('div', 'array-card-head');
        head.appendChild(el('span', 'array-card-title', '第 ' + (index + 1) + ' 项'));
        var remove = el('button', 'btn btn-small btn-danger', '删除');
        remove.type = 'button';
        remove.setAttribute('data-action', 'remove-array-item');
        remove.setAttribute('data-array-path', JSON.stringify(segs));
        remove.setAttribute('data-array-index', String(index));
        remove.setAttribute('aria-label', '删除第 ' + (index + 1) + ' 项');
        head.appendChild(remove);
        card.appendChild(head);
        var cardBody = el('div', 'array-card-body');
        cardBody.appendChild(renderObjectFields(itemsSchema, itemSegs, 2));
        card.appendChild(cardBody);
        list.appendChild(card);
      } else {
        var row = el('div', 'array-row');
        row.appendChild(renderInlineValue(itemSegs, itemsSchema, 0, '第 ' + (index + 1) + ' 项'));
        var rowRemove = el('button', 'btn btn-small btn-danger', '删除');
        rowRemove.type = 'button';
        rowRemove.setAttribute('data-action', 'remove-array-item');
        rowRemove.setAttribute('data-array-path', JSON.stringify(segs));
        rowRemove.setAttribute('data-array-index', String(index));
        rowRemove.setAttribute('aria-label', '删除第 ' + (index + 1) + ' 项');
        row.appendChild(rowRemove);
        list.appendChild(row);
      }
    });

    editor.appendChild(list);

    var addRow = el('div', 'collection-add');
    var addButton = el('button', 'btn btn-small', '添加一项');
    addButton.type = 'button';
    addButton.setAttribute('data-action', 'add-array-item');
    addButton.setAttribute('data-array-path', JSON.stringify(segs));
    addRow.appendChild(addButton);
    addRow.appendChild(el('span', 'field-note', '新条目会先填入默认值，请按需修改。'));
    editor.appendChild(addRow);
    return editor;
  }

  function renderInlineValue(segs, rawSchema, depth, labelText) {
    var resolved = resolveNode(rawSchema);
    var node = resolved.node || {};
    var secret = secretInfo(segs);

    if (secret) {
      var secretField = renderSecretField(segs, rawSchema, labelText, false);
      return secretField;
    }

    if (resolved.unionComplex) {
      return renderJsonField(segs, rawSchema, labelText, false, '复杂值使用 JSON 编辑。', true);
    }

    if (node.type === 'object' || node.properties) {
      var props = node.properties || {};
      if (Object.keys(props).length) {
        var wrapper = el('div', 'inline-object');
        wrapper.appendChild(renderObjectFields(rawSchema, segs, depth + 1));
        if (segs[0] === 'tools' && segs[1] === 'mcpServers') {
          var notes = wrapper.querySelectorAll('.field-note');
          for (var i = 0; i < notes.length; i += 1) notes[i].parentNode.removeChild(notes[i]);
        }
        return wrapper;
      }
      if (node.additionalProperties && typeof node.additionalProperties === 'object') {
        return buildMapEditor(segs, rawSchema);
      }
      return renderJsonField(segs, rawSchema, labelText, false, '该值使用 JSON 编辑。', true);
    }

    if (node.type === 'array') {
      if (!node.items || typeof node.items !== 'object') {
        return renderJsonField(segs, rawSchema, labelText, false, '该数组使用 JSON 编辑。', true);
      }
      var itemResolved = resolveNode(node.items);
      if (itemResolved.unionComplex || (!itemResolved.node.type && !itemResolved.node.properties)) {
        return renderJsonField(segs, rawSchema, labelText, false, '该数组使用 JSON 编辑。', true);
      }
      return buildArrayEditor(segs, rawSchema);
    }

    var id = nextId('inline');
    var control = buildScalarControl(segs, rawSchema, id, labelText, false, true);
    var controlWrap = el('div', 'inline-control');
    controlWrap.appendChild(control);
    return controlWrap;
  }

  function renderJsonField(segs, rawSchema, labelText, isRequired, note, inline) {
    var path = pathKey(segs);
    var wrap;
    var stateSpan = null;
    var head = null;
    if (inline) {
      wrap = el('div', 'json-field');
      wrap.setAttribute('data-field-path', path);
    } else {
      var shell = createFieldShell(segs);
      wrap = shell.wrap;
      stateSpan = shell.stateSpan;
      head = shell.head;
    }

    var id = nextId('json');
    if (head) addVisibleLabel(head, id, labelText, isRequired);
    appendFieldDescription(wrap, rawSchema);

    var value = getAt(state.draft, segs);
    if (value === undefined) value = defaultForSchema(rawSchema, 0);

    var textarea = document.createElement('textarea');
    textarea.id = id;
    textarea.rows = 8;
    textarea.spellcheck = false;
    textarea.setAttribute('data-value-type', 'json');
    textarea.setAttribute('data-json-input', '1');
    textarea.setAttribute('data-json-path', path);
    textarea.setAttribute('data-path', JSON.stringify(segs));
    if (inline) textarea.setAttribute('aria-label', labelText);
    textarea.value = JSON.stringify(value === undefined ? null : value, null, 2);
    wrap.appendChild(textarea);

    var actions = el('div', 'json-actions');
    var formatButton = el('button', 'btn btn-small', '格式化 JSON');
    formatButton.type = 'button';
    formatButton.setAttribute('data-action', 'format-json');
    actions.appendChild(formatButton);
    if (note) actions.appendChild(el('span', 'field-note', note));
    wrap.appendChild(actions);

    var error = el('p', 'field-error');
    error.hidden = true;
    error.setAttribute('data-json-error', path);
    wrap.appendChild(error);

    appendFieldMeta(wrap, rawSchema, { required: isRequired });
    return wrap;
  }

  function clearFieldError(wrap) {
    if (!wrap) return;
    var errors = wrap.querySelectorAll('.validation-error');
    for (var i = 0; i < errors.length; i += 1) {
      if (errors[i].parentNode) errors[i].parentNode.removeChild(errors[i]);
    }
    var controls = wrap.querySelectorAll('[aria-invalid="true"]');
    for (var j = 0; j < controls.length; j += 1) {
      if (controls[j].getAttribute('data-json-input') === '1') continue;
      controls[j].removeAttribute('aria-invalid');
    }
  }

  function markFieldError(control, message) {
    if (!control) return;
    var wrap = control.closest('.field');
    control.setAttribute('aria-invalid', 'true');
    if (wrap) {
      var error = el('p', 'field-note validation-error', message);
      error.setAttribute('role', 'alert');
      wrap.appendChild(error);
    }
  }

  function revealControl(control) {
    if (!control) return;
    var section = control.closest('.config-group');
    if (section) {
      var groupKey = section.getAttribute('data-group-key');
      if (groupKey && groupKey !== state.activeGroup) {
        state.activeGroup = groupKey;
        applyActiveGroup();
      }
    }
    var details = control.closest('details');
    while (details) {
      details.open = true;
      var parent = details.parentElement;
      details = parent ? parent.closest('details') : null;
    }
    try { control.focus(); } catch (e) { /* ignore */ }
  }

  function showJsonError(path, message) {
    var error = document.querySelector('[data-json-error="' + (window.CSS && CSS.escape ? CSS.escape(path) : path.replace(/"/g, '\\"')) + '"]');
    if (error) {
      error.textContent = message;
      error.hidden = !message;
    }
    var textarea = document.querySelector('[data-json-path="' + (window.CSS && CSS.escape ? CSS.escape(path) : path.replace(/"/g, '\\"')) + '"]');
    if (textarea) {
      if (message) textarea.setAttribute('aria-invalid', 'true');
      else textarea.removeAttribute('aria-invalid');
    }
  }

  // ---------- 差异展示与状态 ----------

  function updateFieldStates() {
    var map = {};
    state.diffEntries.forEach(function (entry) { map[entry.path] = entry; });
    var fields = byId('config-sections').querySelectorAll('[data-field-path]');
    for (var i = 0; i < fields.length; i += 1) {
      var field = fields[i];
      var path = field.getAttribute('data-field-path');
      var stateEl = field.querySelector('.field-state');
      if (!stateEl) continue;
      var entry = map[path];
      if (entry) {
        if (entry.secret === 'clear') {
          stateEl.textContent = '将清除';
          stateEl.hidden = false;
        } else if (entry.secret === 'replace') {
          stateEl.textContent = '已替换';
          stateEl.hidden = false;
        } else if (entry.old === undefined) {
          stateEl.textContent = '已新增';
          stateEl.hidden = false;
        } else if (entry.new === undefined) {
          stateEl.textContent = '将删除';
          stateEl.hidden = false;
        } else {
          stateEl.textContent = '已修改 · 原值：' + formatValue(entry.old, 46);
          stateEl.title = '原值：' + formatValue(entry.old, 400) + '；新值：' + formatValue(entry.new, 400);
          stateEl.hidden = false;
        }
        continue;
      }
      var count = state.diffEntries.filter(function (e) { return withinPath(e.path, path); }).length;
      if (count > 0) {
        stateEl.textContent = count + ' 项子变更';
        stateEl.hidden = false;
        stateEl.removeAttribute('title');
      } else {
        stateEl.hidden = true;
        stateEl.textContent = '';
        stateEl.removeAttribute('title');
      }
    }
  }

  function updateSummaryBadges() {
    var badges = byId('config-sections').querySelectorAll('[data-badge-for]');
    for (var i = 0; i < badges.length; i += 1) {
      var badge = badges[i];
      var path = badge.getAttribute('data-badge-for');
      var count = state.diffEntries.filter(function (entry) { return withinPath(entry.path, path); }).length;
      if (count > 0) {
        badge.textContent = count + ' 项修改';
        badge.hidden = false;
      } else {
        badge.hidden = true;
        badge.textContent = '';
      }
    }
    var navCounts = byId('config-nav-list').querySelectorAll('[data-nav-count]');
    for (var j = 0; j < navCounts.length; j += 1) {
      var navBadge = navCounts[j];
      var key = navBadge.getAttribute('data-nav-count');
      var keyCount = state.diffEntries.filter(function (entry) { return withinPath(entry.path, key); }).length;
      if (keyCount > 0) {
        navBadge.textContent = String(keyCount);
        navBadge.hidden = false;
      } else {
        navBadge.hidden = true;
        navBadge.textContent = '';
      }
    }
  }

  function refreshDiff() {
    state.diffEntries = [];
    computeDiff(state.baseline, state.draft, [], state.diffEntries);
    state.dirty = state.diffEntries.length > 0;

    updateFieldStates();
    updateSummaryBadges();

    var count = state.diffEntries.length;
    var bar = byId('actionbar');
    var dirtyLabel = byId('dirty-label');
    if (count > 0) {
      bar.hidden = false;
      document.body.classList.add('has-savebar');
      dirtyLabel.textContent = count + ' 项未保存';
      dirtyLabel.classList.add('is-dirty');
    } else {
      bar.hidden = true;
      document.body.classList.remove('has-savebar');
      dirtyLabel.textContent = '没有未保存修改';
      dirtyLabel.classList.remove('is-dirty');
    }

    var saveButton = byId('save-btn');
    saveButton.disabled = !state.ready || state.saving || count === 0;
    saveButton.textContent = state.saving ? '保存中…' : '保存更改';
    byId('discard-btn').disabled = state.saving || count === 0;

    if (count > 0) hideSuccessNotice();
  }

  // ---------- 状态/提示 ----------

  function hideErrorNotice() {
    byId('notice-error').hidden = true;
    byId('notice-error-text').textContent = '';
    byId('notice-error-action-wrap').hidden = true;
    state.noticeAction = null;
  }

  function hideSuccessNotice() {
    byId('notice-success').hidden = true;
    byId('notice-success-text').textContent = '';
    if (toastTimer) {
      window.clearTimeout(toastTimer);
      toastTimer = null;
    }
  }

  function showErrorNotice(message, actionLabel, action) {
    byId('notice-error-text').textContent = message;
    byId('notice-error-action-wrap').hidden = !actionLabel;
    byId('notice-error-action-btn').textContent = actionLabel || '重新加载';
    state.noticeAction = action || null;
    byId('notice-error').hidden = false;
    byId('notice-success').hidden = true;
  }

  function showSuccessNotice(message) {
    byId('notice-success-text').textContent = message;
    byId('notice-success').hidden = false;
    byId('notice-error').hidden = true;
    if (toastTimer) window.clearTimeout(toastTimer);
    toastTimer = window.setTimeout(function () {
      byId('notice-success').hidden = true;
      toastTimer = null;
    }, 6000);
  }

  function setLoading(isLoading) {
    state.loading = isLoading;
    byId('main-content').setAttribute('aria-busy', isLoading ? 'true' : 'false');
    byId('state-loading').hidden = !isLoading;
    if (isLoading) {
      byId('state-error').hidden = true;
      byId('settings-root').hidden = true;
      byId('actionbar').hidden = true;
      document.body.classList.remove('has-savebar');
      hideErrorNotice();
      hideSuccessNotice();
    }
  }

  function showLoadError(message) {
    byId('state-loading').hidden = true;
    byId('settings-root').hidden = true;
    byId('actionbar').hidden = true;
    document.body.classList.remove('has-savebar');
    byId('load-error-message').textContent = message;
    byId('state-error').hidden = false;
    byId('main-content').setAttribute('aria-busy', 'false');
    state.ready = false;
  }

  function setBusy(isBusy) {
    state.saving = isBusy;
    byId('settings-root').setAttribute('aria-busy', isBusy ? 'true' : 'false');
    byId('reload-btn').disabled = isBusy;
    var controls = byId('config-sections').querySelectorAll('input,select,textarea,button');
    for (var i = 0; i < controls.length; i += 1) {
      var control = controls[i];
      if (isBusy) {
        if (!control.disabled) {
          control.setAttribute('data-busy-disabled', '1');
          control.disabled = true;
        }
      } else if (control.getAttribute('data-busy-disabled') === '1') {
        control.disabled = false;
        control.removeAttribute('data-busy-disabled');
      }
    }
    var saveButton = byId('save-btn');
    saveButton.disabled = isBusy || !state.ready || state.diffEntries.length === 0;
    saveButton.textContent = isBusy ? '保存中…' : '保存更改';
    byId('discard-btn').disabled = isBusy || state.diffEntries.length === 0;
  }

  function setSecretClear(checkbox) {
    var canonical = checkbox.getAttribute('data-clear-secret');
    var wrap = checkbox.closest('.field');
    if (!wrap) return;
    var input = wrap.querySelector('input[data-value-type="secret"]');
    var paths = JSON.parse(checkbox.getAttribute('data-path'));
    if (checkbox.checked) {
      state.clearSecrets.add(canonical);
      if (input) {
        input.value = '';
        input.disabled = true;
        input.placeholder = '保存后将清除该密钥';
      }
      setAt(state.draft, paths, '');
    } else {
      state.clearSecrets.delete(canonical);
      if (input) {
        input.disabled = false;
        input.placeholder = input.getAttribute('data-secret-configured') === '1' ? '留空保持不变' : '留空则不设置';
      }
      var current = getAt(state.draft, paths);
      if (typeof current !== 'string' || current === '') setAt(state.draft, paths, '');
    }
    refreshDiff();
  }

  // ---------- 输入处理 ----------

  function coerceControlValue(control) {
    var type = control.getAttribute('data-value-type');
    if (control.getAttribute('data-empty-null') === '1' && control.value === '') return null;
    var unitScale = Number(control.getAttribute('data-unit-scale'));
    if (isFinite(unitScale) && unitScale > 1) {
      if (control.value === '') return null;
      var scaledValue = Number(control.value);
      return isFinite(scaledValue) ? Math.round(scaledValue * unitScale) : null;
    }
    if (type === 'boolean') return control.checked;
    if (type === 'integer') {
      if (control.value === '') return null;
      var intValue = Number(control.value);
      return isFinite(intValue) ? Math.trunc(intValue) : null;
    }
    if (type === 'number') {
      if (control.value === '') return null;
      var numberValue = Number(control.value);
      return isFinite(numberValue) ? numberValue : null;
    }
    if (type === 'enum') {
      if (control.value === '__null__') return null;
      var enumType = control.getAttribute('data-enum-type');
      if (enumType === 'integer') return control.value === '' ? null : Number(control.value);
      if (enumType === 'number') return control.value === '' ? null : Number(control.value);
      if (enumType === 'boolean') return control.value === 'true';
      return control.value;
    }
    return control.value;
  }

  function handleControlValue(control) {
    if (!control || !control.getAttribute) return;
    if (control.getAttribute('data-value-type') === 'json') {
      handleJsonInput(control);
      return;
    }
    var pathAttr = control.getAttribute('data-path');
    if (!pathAttr) return;
    var segs = JSON.parse(pathAttr);
    var type = control.getAttribute('data-value-type');
    if (type === 'secret') {
      if (control.disabled) return;
      setAt(state.draft, segs, control.value);
    } else {
      setAt(state.draft, segs, coerceControlValue(control));
    }
    var field = control.closest('.field');
    if (field) clearFieldError(field);
    refreshDiff();
  }

  function handleJsonInput(textarea) {
    var path = textarea.getAttribute('data-json-path');
    var segs = JSON.parse(textarea.getAttribute('data-path'));
    var raw = textarea.value;
    try {
      var parsed = JSON.parse(raw);
      state.jsonErrors.delete(path);
      setAt(state.draft, segs, parsed);
      showJsonError(path, '');
      var field = textarea.closest('.field');
      if (field) clearFieldError(field);
    } catch (e) {
      state.jsonErrors.set(path, 'JSON 格式无效，请检查括号、引号和逗号。');
      showJsonError(path, 'JSON 格式无效，请检查括号、引号和逗号。');
    }
    refreshDiff();
  }

  function positiveNumber(value) {
    var number = Number(value);
    return isFinite(number) ? number : 0;
  }

  // ---------- 结构操作 ----------

  function ensureJsonCleanForStructure() {
    if (state.jsonErrors.size > 0) {
      showErrorNotice('有 JSON 字段格式无效。请先修正 JSON，再进行添加或删除操作。');
      var firstPath = state.jsonErrors.keys().next().value;
      var textarea = document.querySelector('[data-json-path="' + (window.CSS && CSS.escape ? CSS.escape(firstPath) : firstPath) + '"]');
      revealControl(textarea);
      return false;
    }
    return true;
  }

  function addArrayItem(button) {
    if (!ensureJsonCleanForStructure()) return;
    var segs = JSON.parse(button.getAttribute('data-array-path'));
    var arraySchema = schemaAtPath(segs);
    if (!arraySchema) return;
    var resolved = resolveNode(arraySchema);
    var itemsSchema = resolved.node.items;
    if (!itemsSchema) return;
    var arrayValue = getAt(state.draft, segs);
    if (!Array.isArray(arrayValue)) arrayValue = [];
    arrayValue.push(defaultForSchema(itemsSchema, 0));
    setAt(state.draft, segs, arrayValue);
    rerenderPreserving();
  }

  function removeArrayItem(button) {
    if (!ensureJsonCleanForStructure()) return;
    var segs = JSON.parse(button.getAttribute('data-array-path'));
    var index = Number(button.getAttribute('data-array-index'));
    var arrayValue = getAt(state.draft, segs);
    if (!Array.isArray(arrayValue) || index < 0 || index >= arrayValue.length) return;
    arrayValue.splice(index, 1);
    setAt(state.draft, segs, arrayValue);
    rerenderPreserving();
  }

  function addMapEntry(button) {
    if (!ensureJsonCleanForStructure()) return;
    var addRow = button.closest('.map-add');
    var editor = button.closest('[data-map-editor]');
    if (!editor || !addRow) return;
    var segs = JSON.parse(button.getAttribute('data-map-path'));
    var mapSchema = schemaAtPath(segs);
    if (!mapSchema) return;
    var resolved = resolveNode(mapSchema);
    var additional = resolved.node.additionalProperties;
    var valueSchema = (additional && typeof additional === 'object') ? additional : { type: 'string' };
    var keyInput = addRow.querySelector('[data-map-new-key]');
    var error = directMapError(editor);
    var key = keyInput ? keyInput.value.trim() : '';
    var mapValue = getAt(state.draft, segs);
    if (!isPlainObject(mapValue)) mapValue = {};
    if (!key) {
      if (error) { error.textContent = '键名不能为空。'; error.hidden = false; }
      if (keyInput) keyInput.focus();
      return;
    }
    if (hasOwn(mapValue, key)) {
      if (error) { error.textContent = '该键名已存在。'; error.hidden = false; }
      if (keyInput) keyInput.focus();
      return;
    }
    mapValue[key] = defaultForSchema(valueSchema, 0);
    setAt(state.draft, segs, mapValue);
    rerenderPreserving();
  }

  function removeMapEntry(button) {
    if (!ensureJsonCleanForStructure()) return;
    var segs = JSON.parse(button.getAttribute('data-map-path'));
    var key = button.getAttribute('data-map-key');
    deleteAt(state.draft, segs.concat(key));
    rerenderPreserving();
  }

  function renameMapKey(input) {
    var newKey = input.value.trim();
    var oldKey = input.getAttribute('data-old-key');
    var segs = JSON.parse(input.getAttribute('data-map-path'));
    var editor = input.closest('[data-map-editor]');
    var error = directMapError(editor);
    if (newKey === oldKey) return;
    var mapValue = getAt(state.draft, segs);
    if (!isPlainObject(mapValue)) return;
    if (!newKey) {
      input.value = oldKey;
      input.setAttribute('aria-invalid', 'true');
      if (error) { error.textContent = '键名不能为空，已恢复原键名。'; error.hidden = false; }
      return;
    }
    if (hasOwn(mapValue, newKey)) {
      input.value = oldKey;
      input.setAttribute('aria-invalid', 'true');
      if (error) { error.textContent = '该键名已存在，已恢复原键名。'; error.hidden = false; }
      return;
    }
    var rebuilt = {};
    Object.keys(mapValue).forEach(function (key) {
      rebuilt[key === oldKey ? newKey : key] = mapValue[key];
    });
    setAt(state.draft, segs, rebuilt);
    rerenderPreserving();
  }

  function formatJson(button) {
    var wrap = button.closest('.json-field');
    if (!wrap) return;
    var textarea = wrap.querySelector('textarea[data-json-input]');
    if (!textarea) return;
    try {
      var parsed = JSON.parse(textarea.value);
      textarea.value = JSON.stringify(parsed, null, 2);
      var path = textarea.getAttribute('data-json-path');
      state.jsonErrors.delete(path);
      showJsonError(path, '');
      setAt(state.draft, JSON.parse(textarea.getAttribute('data-path')), parsed);
      refreshDiff();
    } catch (e) {
      var path2 = textarea.getAttribute('data-json-path');
      state.jsonErrors.set(path2, 'JSON 格式无效，无法格式化。');
      showJsonError(path2, 'JSON 格式无效，无法格式化。');
    }
  }

  function captureOpenKeys() {
    var result = new Set();
    var details = byId('config-sections').querySelectorAll('details[data-open-key]');
    for (var i = 0; i < details.length; i += 1) {
      if (details[i].open) result.add(details[i].getAttribute('data-open-key'));
    }
    return result;
  }

  function rerenderPreserving() {
    var openKeys = captureOpenKeys();
    renderAll(openKeys);
  }

  // ---------- 校验 ----------

  function clearValidationErrors() {
    var errors = byId('config-sections').querySelectorAll('.validation-error');
    for (var i = 0; i < errors.length; i += 1) {
      if (errors[i].parentNode) errors[i].parentNode.removeChild(errors[i]);
    }
    var invalid = byId('config-sections').querySelectorAll('[aria-invalid="true"]');
    for (var j = 0; j < invalid.length; j += 1) {
      if (invalid[j].getAttribute('data-json-input') !== '1') invalid[j].removeAttribute('aria-invalid');
    }
  }

  function validateForSave() {
    clearValidationErrors();
    var issues = [];

    if (state.jsonErrors.size > 0) {
      var firstJsonPath = state.jsonErrors.keys().next().value;
      var firstJson = document.querySelector('[data-json-path="' + (window.CSS && CSS.escape ? CSS.escape(firstJsonPath) : firstJsonPath) + '"]');
      return {
        ok: false,
        message: 'JSON 字段格式无效，请先修正再保存。',
        first: firstJson || null
      };
    }

    var controls = byId('config-sections').querySelectorAll('input[data-value-type],select[data-value-type],textarea[data-value-type]');
    for (var i = 0; i < controls.length; i += 1) {
      var control = controls[i];
      if (control.disabled) continue;
      if (control.getAttribute('data-value-type') === 'json') continue;
      if (control.type === 'checkbox') continue;

      var message = '';
      if (control.validity && control.validity.badInput) {
        message = '请输入有效数字。';
      } else if (control.validity && control.validity.rangeUnderflow) {
        message = '数值不能小于 ' + (control.min || '最小值') + '。';
      } else if (control.validity && control.validity.rangeOverflow) {
        message = '数值不能大于 ' + (control.max || '最大值') + '。';
      } else if (control.validity && control.validity.tooShort) {
        message = '内容长度不足。';
      } else if (control.validity && control.validity.tooLong) {
        message = '内容长度超出限制。';
      } else if (control.hasAttribute('required') && String(control.value).trim() === '') {
        message = '此项为必填。';
      }

      if (message) {
        markFieldError(control, message);
        issues.push({ control: control, message: message });
      }
    }

    if (issues.length) {
      return {
        ok: false,
        message: '有 ' + issues.length + ' 个字段需要修正。请检查标红的输入项。',
        first: issues[0].control
      };
    }
    return { ok: true };
  }

  // ---------- 确认对话框 ----------

  function openConfirm(options) {
    var dialog = byId('confirm-dialog');
    byId('confirm-title').textContent = options.title;
    byId('confirm-message').textContent = options.message;
    var extra = byId('confirm-extra');
    clearNode(extra);
    if (options.extraText) extra.appendChild(el('p', 'hint', options.extraText));

    if (options.paths && options.paths.length) {
      extra.appendChild(el('p', 'hint', '以下已配置的密钥会被清除，原值不会显示：'));
      var list = el('ul', 'confirm-changes');
      options.paths.forEach(function (path) {
        var item = el('li');
        item.appendChild(el('span', 'diff-path', path));
        list.appendChild(item);
      });
      extra.appendChild(list);
    }

    var okButton = byId('confirm-ok');
    okButton.textContent = options.confirmLabel || '确认';
    okButton.className = options.danger ? 'btn btn-danger' : 'btn btn-primary';
    state.confirmCallback = options.onConfirm || null;
    if (typeof dialog.showModal === 'function') {
      dialog.showModal();
    } else {
      dialog.setAttribute('open', 'open');
    }
    if (options.focusConfirm) okButton.focus();
    else byId('confirm-cancel').focus();
  }

  function closeConfirm() {
    var dialog = byId('confirm-dialog');
    state.confirmCallback = null;
    if (dialog.open && typeof dialog.close === 'function') dialog.close();
    else dialog.removeAttribute('open');
  }

  // ---------- 加载与保存 ----------

  async function requestJson(url, options) {
    var controller = new AbortController();
    var timer = window.setTimeout(function () { controller.abort(); }, 30000);
    var response;
    try {
      response = await fetch(url, Object.assign({}, options || {}, {
        signal: controller.signal,
        cache: 'no-store',
        credentials: 'same-origin'
      }));
    } catch (error) {
      window.clearTimeout(timer);
      var netError = new Error(error && error.name === 'AbortError' ? 'timeout' : 'network');
      netError.code = error && error.name === 'AbortError' ? 'timeout' : 'network';
      throw netError;
    }
    window.clearTimeout(timer);
    var text = '';
    try { text = await response.text(); } catch (error) { text = ''; }
    var data = null;
    if (text) {
      try { data = JSON.parse(text); } catch (error) { data = null; }
    }
    return { ok: response.ok, status: response.status, data: data, text: text };
  }

  function formatDetail(detail) {
    if (typeof detail === 'string') return shortText(detail, 300);
    if (Array.isArray(detail)) {
      var parts = [];
      detail.slice(0, 5).forEach(function (item) {
        if (typeof item === 'string') {
          parts.push(item);
          return;
        }
        if (!item || typeof item !== 'object') return;
        var location = '';
        if (Array.isArray(item.loc)) {
          location = item.loc.filter(function (part) { return part !== 'body'; }).join('.');
        }
        var message = typeof item.msg === 'string' ? item.msg : '参数无效';
        parts.push((location ? location + '：' : '') + message);
      });
      if (detail.length > 5) parts.push('…');
      return shortText(parts.join('；'), 400);
    }
    if (detail && typeof detail === 'object') {
      if (typeof detail.message === 'string') return shortText(detail.message, 300);
      if (typeof detail.msg === 'string') return shortText(detail.msg, 300);
      if (typeof detail.error === 'string') return shortText(detail.error, 300);
      return '后端返回了结构化错误。';
    }
    return '';
  }

  function extractError(result) {
    var detail = '';
    if (result && result.data && typeof result.data === 'object' && hasOwn(result.data, 'detail')) {
      detail = formatDetail(result.data.detail);
    }
    if (!detail && result && result.data && typeof result.data === 'object') {
      if (typeof result.data.message === 'string') detail = shortText(result.data.message, 300);
      else if (typeof result.data.msg === 'string') detail = shortText(result.data.msg, 300);
    }
    var status = result ? result.status : 0;
    if (status === 409) {
      return detail
        ? '配置已在别处修改（HTTP 409）：' + detail + '。请重新加载后再试。'
        : '配置已在别处修改（HTTP 409）。请重新加载后再试。';
    }
    if (status === 401 || status === 403) {
      return detail ? '没有权限（HTTP ' + status + '）：' + detail : '没有权限（HTTP ' + status + '）。';
    }
    if (status === 404) {
      return detail ? '设置接口不存在（HTTP 404）：' + detail : '设置接口不存在（HTTP 404）。请确认后端提供 GET/PUT /api/settings。';
    }
    if (status === 422) {
      return detail ? '配置校验失败（HTTP 422）：' + detail : '配置校验失败（HTTP 422）。';
    }
    if (status >= 500) {
      return detail ? '设置服务内部错误（HTTP ' + status + '）：' + detail : '设置服务内部错误（HTTP ' + status + '）。';
    }
    return detail ? '请求失败（HTTP ' + status + '）：' + detail : '请求失败（HTTP ' + status + '）。';
  }

  function scrubSecretValue(value, rawSchema, segs, depth) {
    if (secretInfo(segs)) return '';
    if (value === undefined || value === null) return value;
    var level = depth || 0;
    if (level > 14) return value;
    var resolved = resolveNode(rawSchema);
    var node = resolved.node || {};
    if (resolved.unionComplex) return value;

    if ((node.type === 'object' || node.properties) && isPlainObject(value)) {
      var out = {};
      Object.keys(value).forEach(function (key) { out[key] = value[key]; });
      var props = node.properties || {};
      Object.keys(props).forEach(function (key) {
        if (hasOwn(out, key)) out[key] = scrubSecretValue(out[key], props[key], segs.concat(key), level + 1);
      });
      if (node.additionalProperties && typeof node.additionalProperties === 'object') {
        Object.keys(out).forEach(function (key) {
          if (!hasOwn(props, key)) {
            out[key] = scrubSecretValue(out[key], node.additionalProperties, segs.concat(key), level + 1);
          }
        });
      }
      return out;
    }

    if (node.type === 'array' && Array.isArray(value) && node.items && typeof node.items === 'object') {
      return value.map(function (item, index) {
        return scrubSecretValue(item, node.items, segs.concat(index), level + 1);
      });
    }
    return value;
  }

  function applyPayload(data) {
    if (isPlainObject(data.schema)) state.schema = clone(data.schema);
    state.defs = (state.schema && (state.schema.$defs || state.schema.definitions)) || {};
    state.revision = typeof data.revision === 'string' && data.revision ? data.revision : null;
    state.secretFields = isPlainObject(data.secret_fields) ? clone(data.secret_fields) : {};
    state.restartRequired = !!data.restart_required;
    state.clearSecrets = new Set();
    state.jsonErrors = new Map();
    state.config = scrubSecretValue(clone(data.config), state.schema, [], 0);
    state.baseline = normalizeValue(state.config, state.schema, 0);
    state.draft = clone(state.baseline);
  }

  async function loadSettings() {
    if (state.saving) return;
    setLoading(true);
    try {
      var result = await requestJson('/api/settings', {
        method: 'GET',
        headers: { 'Accept': 'application/json' }
      });
      if (!result.ok) {
        throw { userMessage: extractError(result) };
      }
      if (!isPlainObject(result.data) || !isPlainObject(result.data.config) || !isPlainObject(result.data.schema)) {
        throw { userMessage: '设置服务返回的数据不完整：缺少 config 或 schema。请检查后端 /api/settings。' };
      }
      applyPayload(result.data);
      state.ready = true;
      state.restartRequired = !!result.data.restart_required;
      state.addProviderStage = 'idle';
      state.addProviderKey = null;
      renderAll(null);
      byId('state-loading').hidden = true;
      byId('state-error').hidden = true;
      byId('settings-root').hidden = false;
      hideErrorNotice();
      hideSuccessNotice();
      byId('main-content').setAttribute('aria-busy', 'false');
    } catch (error) {
      var message;
      if (error && error.userMessage) message = error.userMessage;
      else if (error && error.code === 'timeout') message = '读取配置超时。请确认设置服务正在运行。';
      else if (error && error.code === 'network') message = '无法连接设置服务。请确认页面由后端 Web 服务提供；直接打开本地 HTML 文件时没有可用的设置 API。';
      else message = '读取配置失败。请检查设置服务是否正常运行。';
      showLoadError(message);
      state.ready = false;
    } finally {
      state.loading = false;
      byId('state-loading').hidden = true;
    }
  }

  function requestSave() {
    if (state.saving || !state.ready) return;
    if (!state.revision) {
      showErrorNotice('后端响应缺少 revision，无法安全保存。请重新加载配置或检查后端实现。');
      return;
    }
    if (state.diffEntries.length === 0) return;
    var validation = validateForSave();
    if (!validation.ok) {
      showErrorNotice(validation.message);
      revealControl(validation.first);
      return;
    }
    var clearPaths = Array.from(state.clearSecrets);
    if (clearPaths.length) {
      openConfirm({
        title: '确认清除密钥',
        message: '这次保存会清除 ' + clearPaths.length + ' 个已配置的密钥，其他修改会一起保存。',
        paths: clearPaths,
        confirmLabel: '清除并保存',
        danger: true,
        focusConfirm: false,
        onConfirm: doSave
      });
      return;
    }
    doSave();
  }

  async function doSave() {
    if (state.saving) return;
    setBusy(true);
    hideErrorNotice();
    hideSuccessNotice();
    try {
      var result = await requestJson('/api/settings', {
        method: 'PUT',
        headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' },
        body: JSON.stringify({
          config: state.draft,
          revision: state.revision,
          clear_secrets: Array.from(state.clearSecrets)
        })
      });

      if (!result.ok) {
        var message = extractError(result);
        if (result.status === 409) {
          showErrorNotice(message, '重新加载配置', function () { requestReload(); });
        } else {
          showErrorNotice(message);
        }
        return;
      }

      if (!isPlainObject(result.data)) {
        showErrorNotice('保存响应不是 JSON 对象。草稿仍保留在页面中；请重新加载确认配置状态。');
        return;
      }
      if (result.data.saved === false) {
        var backendMessage = typeof result.data.message === 'string' ? result.data.message : '后端未确认保存。';
        showErrorNotice(backendMessage);
        return;
      }
      if (!isPlainObject(result.data.config)) {
        showErrorNotice('保存响应缺少 config。草稿仍保留；请重新加载确认配置状态。');
        return;
      }
      if (!isPlainObject(result.data.schema) && state.schema) {
        result.data.schema = state.schema;
      }

      var openKeys = captureOpenKeys();
      applyPayload(result.data);
      state.ready = true;
      state.addProviderStage = 'idle';
      state.addProviderKey = null;
      renderAll(openKeys);

      var successMessage = '已保存，重启 Agent 后生效';
      if (!state.revision) {
        successMessage += '。后端未返回 revision，请重新加载后再继续修改';
      }
      showSuccessNotice(successMessage);
    } catch (error) {
      if (error && error.code === 'timeout') {
        showErrorNotice('保存请求超时，无法确认是否已写入。草稿仍保留；请重新加载核对配置。');
      } else if (error && error.code === 'network') {
        showErrorNotice('无法连接设置服务，保存未确认。草稿仍保留；请检查网络或后端进程后重试。');
      } else {
        showErrorNotice('保存失败，草稿仍保留。请检查后端日志或重新加载配置。');
      }
    } finally {
      setBusy(false);
      refreshDiff();
      byId('save-btn').disabled = !state.ready || state.diffEntries.length === 0;
    }
  }

  function discardChanges() {
    if (state.saving || !state.diffEntries.length) return;
    var count = state.diffEntries.length;
    state.draft = clone(state.baseline);
    state.clearSecrets = new Set();
    state.jsonErrors = new Map();
    state.addProviderStage = 'idle';
    state.addProviderKey = null;
    rerenderPreserving();
    hideErrorNotice();
    showSuccessNotice('已放弃 ' + count + ' 项未保存修改');
  }

  function requestReload() {
    if (state.saving) return;
    if (state.diffEntries.length) {
      openConfirm({
        title: '重新加载配置',
        message: '当前有 ' + state.diffEntries.length + ' 项未保存修改。重新加载会丢弃这些修改。',
        confirmLabel: '丢弃并重新加载',
        danger: true,
        focusConfirm: false,
        onConfirm: loadSettings
      });
    } else {
      loadSettings();
    }
  }

  // ---------- 事件绑定 ----------

  function bindEvents() {
    byId('save-btn').addEventListener('click', requestSave);
    byId('discard-btn').addEventListener('click', discardChanges);
    byId('reload-btn').addEventListener('click', requestReload);
    byId('retry-btn').addEventListener('click', loadSettings);
    byId('notice-error-action-btn').addEventListener('click', function () {
      if (typeof state.noticeAction === 'function') state.noticeAction();
    });

    byId('confirm-cancel').addEventListener('click', closeConfirm);
    byId('confirm-ok').addEventListener('click', function () {
      var callback = state.confirmCallback;
      closeConfirm();
      if (typeof callback === 'function') callback();
    });
    byId('confirm-dialog').addEventListener('close', function () {
      state.confirmCallback = null;
    });

    var navList = byId('config-nav-list');
    navList.addEventListener('click', function (event) {
      var button = event.target.closest('button[data-nav-key]');
      if (!button) return;
      switchGroup(button.getAttribute('data-nav-key'));
    });
    byId('group-select').addEventListener('change', function (event) {
      switchGroup(event.target.value);
    });

    var sections = byId('config-sections');
    sections.addEventListener('input', function (event) {
      var target = event.target;
      handleControlValue(target);
      if (target && (target.id === 'agent-model-input' || target.id === 'agent-provider-select')) {
        afterAgentModelChoice();
      }
    });
    sections.addEventListener('change', function (event) {
      var target = event.target;
      if (target.id === 'agent-provider-select' || target.id === 'agent-model-input') {
        handleControlValue(target);
        afterAgentModelChoice();
        return;
      }
      if (target.matches && target.matches('[data-clear-secret]')) {
        setSecretClear(target);
        return;
      }
      if (target.matches && target.matches('[data-map-key-input]')) {
        renameMapKey(target);
        return;
      }
      if (target.matches && target.matches('[data-value-type]')) {
        handleControlValue(target);
      }
    });
    sections.addEventListener('click', function (event) {
      var button = event.target.closest('button[data-action]');
      if (!button) return;
      var action = button.getAttribute('data-action');
      if (action === 'add-array-item') addArrayItem(button);
      else if (action === 'remove-array-item') removeArrayItem(button);
      else if (action === 'add-map-entry') addMapEntry(button);
      else if (action === 'remove-map-entry') removeMapEntry(button);
      else if (action === 'format-json') formatJson(button);
      else if (action === 'add-provider') openAddProvider();
      else if (action === 'continue-add-provider') continueAddProvider();
      else if (action === 'cancel-add-provider') cancelAddProvider();
      else if (action === 'reload-forge-runtime') loadForgeRuntime();
      else if (action === 'search-registry') loadForgeRegistry();
      else if (action === 'forge-skill-install' || action === 'forge-skill-update' || action === 'forge-skill-remove') {
        confirmForgeAction(action, button.getAttribute('data-skill-name'), button.getAttribute('data-skill-version'));
      }
    });
    sections.addEventListener('keydown', function (event) {
      if (event.key !== 'Enter') return;
      var target = event.target;
      if (target.matches && target.matches('[data-registry-input]')) {
        event.preventDefault();
        loadForgeRegistry();
        return;
      }
      if (target.matches && target.matches('[data-map-new-key]')) {
        var addRow = target.closest('.map-add');
        if (addRow) {
          var addButton = addRow.querySelector('button[data-action="add-map-entry"]');
          if (addButton) {
            event.preventDefault();
            addMapEntry(addButton);
          }
        }
      }
    });

    window.addEventListener('beforeunload', function (event) {
      if (state.dirty && !state.saving) {
        event.preventDefault();
        event.returnValue = '';
        return '';
      }
      return undefined;
    });
  }

  bindEvents();
  loadSettings();
})();
</script>
</body>
</html>
