name: Publish release to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published stable release tag (for example v1.1.1)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  prepare:
    if: >-
      github.repository == 'PhyAgentOS/PhyAgentOS-core' &&
      ((github.event_name == 'release' && !github.event.release.prerelease && !github.event.release.draft) ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.prepare.outputs.version }}
      missing: ${{ steps.prepare.outputs.missing }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Verify release assets and check existing PyPI files
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/pypi_release.py prepare --tag "$RELEASE_TAG"
      - name: Preserve verified release distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-pypi-release
          path: release-assets/
          if-no-files-found: error
          retention-days: 14
      - name: Stage only distributions missing from PyPI
        if: steps.prepare.outputs.missing != '0'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pypi-upload
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/PhyAgentOS-ai/${{ needs.prepare.outputs.version }}/
    steps:
      - name: Check publishing credential is configured
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -z "$PYPI_API_TOKEN" ]; then
            echo "::error::Configure the PYPI_API_TOKEN Actions secret. See docs/RELEASING.md."
            exit 1
          fi
      - name: Download distributions to upload
        if: needs.prepare.outputs.missing != '0'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: pypi-upload
          path: dist/
      - name: Publish verified distributions to PyPI
        if: needs.prepare.outputs.missing != '0'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: dist/
          skip-existing: false
          attestations: false # API-token authentication; see docs/RELEASING.md for OIDC.
      - name: Report identical existing release
        if: needs.prepare.outputs.missing == '0'
        run: echo "All distributions already exist on PyPI with matching SHA256; upload skipped."

  verify:
    needs: [prepare, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: verified-pypi-release
          path: release-assets/
      - name: Verify PyPI filenames and hashes
        run: python scripts/pypi_release.py verify --tag "$RELEASE_TAG"
      - name: Install from official PyPI in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/pypi-smoke"
          "$RUNNER_TEMP/pypi-smoke/bin/python" -m pip --isolated install \
            --index-url https://pypi.org/simple/ --no-cache-dir \
            --only-binary PhyAgentOS-ai --report "$RUNNER_TEMP/pypi-install.json" \
            "PhyAgentOS-ai==$RELEASE_VERSION"
          python scripts/pypi_release.py installed --tag "$RELEASE_TAG" \
            --report "$RUNNER_TEMP/pypi-install.json"
          "$RUNNER_TEMP/pypi-smoke/bin/python" -m pip check
          "$RUNNER_TEMP/pypi-smoke/bin/python" -I -c \
            'import os, importlib.metadata, PhyAgentOS; v = os.environ["RELEASE_VERSION"]; assert importlib.metadata.version("PhyAgentOS-ai") == PhyAgentOS.__version__ == v'
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/pypi-smoke/bin/paos" --version
          "$RUNNER_TEMP/pypi-smoke/bin/paos" --help
      - name: Write publication summary
        run: |
          printf 'Verified [%s](https://pypi.org/project/PhyAgentOS-ai/%s/) against GitHub Release hashes and a clean PyPI installation.\n' \
            "$RELEASE_TAG" "$RELEASE_VERSION" >> "$GITHUB_STEP_SUMMARY"
