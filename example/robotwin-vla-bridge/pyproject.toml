[project]
name = "vla-bridge"
version = "0.1.0"
description = "vlm-vla-libero bridge: policy action mux/safety + policy lifecycle control + vla.* ToolEndpoint"
requires-python = ">=3.12"
dependencies = [
    "forge-tool[dora]==1.0.0",
    "dora-rs==0.4.1",
    "forge-msgs==1.2.0",
    "forge-common==1.0.1",
    "numpy>=2,<3",
    "pyyaml>=6.0",
]

[project.scripts]
vla-bridge = "vla_bridge.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vla_bridge"]
